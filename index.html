<script>
"use strict";
/* ---------- Storage layer (swap these two functions for a backend later) ---------- */
const KEY='y8_10_portal_v1';let D={tests:[],last:''};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PUP=[1,2,4,5],DIFF=['Easy','Moderate','Difficult','Very Difficult'];
const SUBJ=['Maths','Additional Maths','Physics','Chemistry','English','Spanish','French'];
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;const r=(a,b)=>a+Math.floor(R()*(b-a+1));
const Q=(q,a,m,w,alt)=>({q,a,m,w,alt});
const nums=(k,lo,hi)=>{const n=Array.from({length:k},()=>r(lo,hi));n[k-1]+=(k-n.reduce((s,x)=>s+x,0)%k)%k;return n};
const sup=(b,n)=>`${b}<sup>${n}</sup>`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const P=(...c)=>{let s='';c.forEach((k,i)=>{const p=c.length-1-i;if(!k)return;const a=Math.abs(k),m=p?(a==1?'':a)+'x'+(p>1?'²':''):a;s+=(k<0?'-':s?'+':'')+m});return s||'0'};
const fx=s=>s.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/^ − /,'−');
const f=x=>+x.toFixed(4),ans=q=>Array.isArray(q.a)?q.a.join(' and '):q.a;
/* ---------- Question bank: BANK[subject][topic] = [easy, moderate, difficult, very difficult] generators.
   Each generator is seeded, so every (topic, difficulty) has 10 repeatable test sets. Add subjects/topics here.
   Answers may be a number, a polynomial string (any term order), or an array of numbers (any order, e.g. two roots). ---------- */
const BANK={Maths:{
'Fractions, decimals & percentages':[
()=>{const b=[4,5,6,8,10][r(0,4)],a=r(2,b-1),k=r(3,12),n=b*k,p=[10,20,25,50][r(0,3)],m=r(2,10)*20,v=a*k+p*m/100;return Q(`Work out ${a}/${b} of ${n}, then add ${p}% of ${m}.`,v,`Do each part separately: divide by the denominator and multiply by the numerator for the fraction; for the percentage, find 1% or use a fraction. Then add.`,`${n} ÷ ${b} × ${a} = ${a*k}; ${p}% of ${m} = ${p*m/100}; total = ${v}`)},
()=>{const p=[15,20,25,30,35,40,60][r(0,6)],o=r(2,15)*20,n=o*(100+p)/100;return Q(`The price of a games console rises from £${o} to £${n}. Work out the percentage increase.`,p,`% change = (change ÷ original) × 100. Always divide by the ORIGINAL amount.`,`Change = ${n} − ${o} = ${n-o}; ${n-o} ÷ ${o} × 100 = ${p}%`)},
()=>{const P0=r(1,8)*200,u=[10,20,30,50][r(0,3)],d=[10,20,25,50][r(0,3)],a=P0*(100+u)/100*(100-d)/100;return Q(`A bike costs £${P0}. Its price is increased by ${u}% and then the new price is reduced by ${d}% in a sale. Find the final price in £.`,a,`Percentage changes are applied one after another, using multipliers: ${(100+u)/100} then ${(100-d)/100}.`,`${P0} × ${(100+u)/100} × ${(100-d)/100} = ${a}. (This is not the same as a single ${u-d}% change.)`)},
()=>{const rt=[10,20][r(0,1)],F=rt==10?121:144,dp=r(1,9)*100,fv=dp*F/100;return Q(`Money is invested at ${rt}% compound interest per year. After 2 years the account holds £${fv}. How much was originally invested (£)?`,dp,`After 2 years the amount has been multiplied by ${1+rt/100} twice, i.e. by ${F/100}. Undo it by DIVIDING by ${F/100}.`,`${fv} ÷ ${F/100} = ${dp}`)}],
'Indices':[
()=>{const b=r(2,5),n=r(2,4),c=r(2,6),m=r(2,3);return Q(`Work out ${sup(b,n)} + ${sup(c,m)}.`,b**n+c**m,`Work out each power separately (repeated multiplication), then add the results.`,`${b**n} + ${c**m} = ${b**n+c**m}`)},
()=>{const b=r(2,9),a=r(2,4),c=r(2,4),d=r(1,6);return Q(`(${sup(b,a)})<sup>${c}</sup> × ${sup(b,d)} = ${sup(b,'n')}. Find n.`,a*c+d,`First multiply the indices in the bracket (power of a power), then add the indices when multiplying.`,`${a}×${c} = ${a*c}, then ${a*c} + ${d} = ${a*c+d}`)},
()=>{const T=[[8,3,2,4],[27,3,2,9],[16,2,3,64],[81,4,3,27],[125,3,2,25],[32,5,2,4],[49,2,3,343],[64,3,2,16],[64,2,3,512],[16,4,3,8]],[b,d,n,v]=T[r(0,9)];return Q(`Work out ${sup(b,n+'/'+d)}.`,v,`In a fractional index the denominator is a root and the numerator is a power. Take the root first, then the power.`,`The root (denominator ${d}) of ${b} is ${Math.round(b**(1/d))}; then raise to the power ${n}: ${v}`)},
()=>{let a,x,m,k;do{a=r(2,4);x=r(2,6);m=r(3,7);k=2*m-a*x}while(!k||Math.abs(k)>8);return Q(`Solve ${sup(2,`${a}x ${sg(k)}`)} = ${sup(4,m)}.`,x,`Write both sides with the same base: 4 = 2², so 4<sup>${m}</sup> = 2<sup>${2*m}</sup>. Then equate the indices and solve.`,`${a}x ${sg(k)} = ${2*m}, so ${a}x = ${2*m-k}, x = ${x}`)}],
'Expressions & formulae':[
()=>{const a=r(2,6),b=r(1,9),c=r(2,6),d=r(1,9),e=P(a+c,a*b-c*d);return Q(`Expand and simplify ${a}(x + ${b}) + ${c}(x − ${d}).`,e,`Expand each bracket by multiplying every term inside, then collect like terms (x terms together, numbers together).`,`${a}x + ${a*b} + ${c}x − ${c*d} = ${fx(e)}`)},
()=>{const p=r(2,3),a=r(1,9),b=r(1,9),s=r(0,1)?1:-1,e=P(p,p*s*b+a,s*a*b);return Q(`Expand and simplify (${p}x + ${a})(x ${s>0?'+':'−'} ${b}).`,e,`Multiply every term in the first bracket by every term in the second (FOIL), then collect like terms.`,`${p}x² + (${p*s*b})x + ${a}x + (${s*a*b}) = ${fx(e)}`)},
()=>{const h=2*r(2,8),a=r(3,12),b=r(3,12),A=h*(a+b)/2;return Q(`The area of a trapezium is A = ½h(a + b). Find b when A = ${A}, h = ${h} and a = ${a}.`,b,`Rearrange first: multiply both sides by 2, divide by h, then subtract a. Then substitute.`,`b = 2A ÷ h − a = ${2*A} ÷ ${h} − ${a} = ${b}`)},
()=>{const a=r(1,6),b=r(1,6),c=r(1,5),e=P(5,3*a-2*b-2*c,-a*b-c*c);return Q(`Expand and simplify (2x + ${a})(3x − ${b}) − (x + ${c})².`,e,`Expand the double bracket, expand the squared bracket as (x + ${c})(x + ${c}), then SUBTRACT every term of the second result.`,`(${fx(P(6,3*a-2*b,-a*b))}) − (${fx(P(1,2*c,c*c))}) = ${fx(e)}`)}],
'Solving equations':[
()=>{const a=r(2,9),x=r(2,12),b=r(1,Math.min(15,a*x-1)),v=a*x-b;return Q(`Solve ${a}x − ${b} = ${v}.`,x,`Undo the subtraction first (add ${b} to both sides), then undo the multiplication (divide by ${a}).`,`${a}x = ${v} + ${b} = ${a*x}, so x = ${x}`)},
()=>{const c=r(1,4),a=c+r(2,4),b=r(1,7),x=r(2,9),d=(a-c)*x+a*b;return Q(`Solve ${a}(x + ${b}) = ${c}x + ${d}.`,x,`Expand the bracket, collect the x terms on one side and the numbers on the other, then divide.`,`${a}x + ${a*b} = ${c}x + ${d} → ${a-c}x = ${d-a*b} → x = ${x}`)},
()=>{let x=r(1,8),p=r(2,6),q=r(2,6),m=r(5,9);while(q==p)q=r(2,6);const a=p*m-x,b=q*m-x;return Q(`Solve (x + ${a})/${p} = (x + ${b})/${q}.`,x,`Cross-multiply to remove the fractions (multiply both sides by ${p*q}), expand, then solve.`,`${q}(x + ${a}) = ${p}(x + ${b}) → ${q}x + ${q*a} = ${p}x + ${p*b} → ${q-p}x = ${p*b-q*a} → x = ${x}`)},
()=>{const m=r(1,9);let n=r(-9,9);while(!n||n==m/2)n=r(-9,9);const e=P(2,-(2*n+m),m*n);return Q(`Solve ${fx(e)} = 0. Give both solutions (for example: 2 and −3).`,[m/2,n],`Factorise into two brackets, set each bracket equal to zero, and solve. Remember a quadratic usually has TWO solutions.`,`(2x − ${m})(x ${n<0?'+':'−'} ${Math.abs(n)}) = 0, so x = ${m/2} or x = ${n}`)}],
'Linear graphs':[
()=>{const m=-r(1,5),dx=r(2,5),x1=r(-3,4),y1=r(0,12),x2=x1+dx,y2=y1+m*dx;return Q(`Find the gradient of the line through (${x1}, ${y1}) and (${x2}, ${y2}).`,m,`Gradient = change in y ÷ change in x. A line going DOWN from left to right has a negative gradient.`,`(${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${m*dx} ÷ ${dx} = ${m}`)},
()=>{const m=r(-5,5)||2,x1=r(1,6),y1=r(-5,12),c=y1-m*x1;return Q(`A straight line has gradient ${m} and passes through the point (${x1}, ${y1}). Find where the line crosses the y-axis (the value of c in y = mx + c).`,c,`Substitute the gradient and the point into y = mx + c, then solve for c.`,`${y1} = ${m}×${x1} + c, so c = ${y1} − (${m*x1}) = ${c}`)},
()=>{const m=r(2,5),x1=m*r(1,4),y1=r(1,9),k=r(1,9);return Q(`A line is perpendicular to y = ${m}x + ${k} and passes through (${x1}, ${y1}). Find the y-intercept (c) of this line.`,y1+x1/m,`Perpendicular gradients multiply to −1, so the new gradient is −1/${m}. Then substitute the point into y = mx + c.`,`m = −1/${m}; ${y1} = (−1/${m})×${x1} + c → c = ${y1} + ${x1/m} = ${y1+x1/m}`)},
()=>{const x=r(-3,6),a=r(2,5),b=r(1,6)*(r(0,1)?1:-1),c=r(1,4),y=a*x+b,d=y+c*x;return Q(`The lines y = ${a}x ${sg(b)} and ${c}x + y = ${d} cross at point P. Find x + y at P.`,x+y,`At the crossing point both equations are true. Substitute the first equation into the second to find x, then find y.`,`${c}x + (${a}x ${sg(b)}) = ${d} → ${a+c}x = ${d-b} → x = ${x}; y = ${y}; x + y = ${x+y}`)}],
'Angle properties':[
()=>{const a=2*r(10,80);return Q(`An isosceles triangle has an angle of ${a}° between its two equal sides. Find the size of one of the other two angles (°).`,(180-a)/2,`The two base angles are equal and all three angles add up to 180°.`,`(180 − ${a}) ÷ 2 = ${(180-a)/2}°`)},
()=>{const e=[40,36,30,24,20,18,15,12][r(0,7)],I=180-e;return Q(`Each interior angle of a regular polygon is ${I}°. How many sides does it have?`,360/e,`Exterior angle = 180° − interior angle, and the exterior angles of any polygon add up to 360°. Sides = 360 ÷ exterior angle.`,`Exterior = 180 − ${I} = ${e}°; 360 ÷ ${e} = ${360/e}`)},
()=>{let a,c,e,b,d,S;do{a=r(1,4);c=r(1,4);e=r(1,4);b=r(1,20);d=r(1,20);S=a+c+e}while((180-b-d)%S||(180-b-d)/S<8);const x=(180-b-d)/S,A=[a*x+b,c*x+d,e*x];return Q(`The angles in a triangle are (${a}x + ${b})°, (${c}x + ${d})° and (${e}x)°. Find the size of the largest angle (°).`,Math.max(...A),`The three angles add to 180°. Form an equation, solve for x, then work out each angle and pick the largest.`,`${S}x + ${b+d} = 180 → x = ${x}. Angles: ${A.join('°, ')}°`)},
()=>{const k=[2,3,4,5,8,11,17][r(0,6)];return Q(`Each interior angle of a regular polygon is ${k} times the size of each exterior angle. How many sides does the polygon have?`,2*(k+1),`Let the exterior angle be e. Interior + exterior = 180°, so ${k}e + e = 180°. Then use 360 ÷ e for the number of sides.`,`${k+1}e = 180, e = ${180/(k+1)}°; sides = 360 ÷ ${180/(k+1)} = ${2*(k+1)}`)}],
'Volume & surface area':[
()=>{const l=r(2,8)*10,w=r(2,6)*10,h=r(1,5)*10,v=l*w*h/1000;return Q(`A fish tank is ${l} cm long, ${w} cm wide and ${h} cm tall. How many litres of water does it hold when completely full? (1 litre = 1000 cm³)`,v,`Find the volume in cm³ (length × width × height), then divide by 1000 to change to litres.`,`${l}×${w}×${h} = ${l*w*h} cm³; ÷ 1000 = ${v} litres`)},
()=>{const a=r(3,8),b=r(9,14),h=2*r(2,5),l=r(4,10),v=(a+b)*(h/2)*l;return Q(`A prism has a trapezium as its cross-section. The parallel sides of the trapezium are ${a} cm and ${b} cm, and the distance between them is ${h} cm. The prism is ${l} cm long. Find its volume (cm³).`,v,`Area of a trapezium = ½(a + b)h. Volume of a prism = cross-section area × length.`,`½ × (${a} + ${b}) × ${h} = ${(a+b)*h/2} cm²; × ${l} = ${v} cm³`)},
()=>{const s=r(2,4),l=s+r(3,8),w=s+r(2,7),h=r(4,12);return Q(`A solid block measures ${l} cm by ${w} cm by ${h} cm. A square hole of side ${s} cm is cut straight through the block, from top to bottom (height ${h} cm). Find the volume of the remaining solid (cm³).`,l*w*h-s*s*h,`Find the volume of the whole block, then subtract the volume of the square hole (also a cuboid).`,`${l}×${w}×${h} = ${l*w*h}; hole = ${s}×${s}×${h} = ${s*s*h}; ${l*w*h} − ${s*s*h} = ${l*w*h-s*s*h}`)},
()=>{const w=r(2,6),k=r(2,4),h=r(2,8),l=k*w,V=l*w*h,A=2*(l*w+l*h+w*h);return Q(`A cuboid has a volume of ${V} cm³. Its length is ${k} times its width and its height is ${h} cm. Find its total surface area (cm²).`,A,`Let the width be w, so length = ${k}w. Volume = ${k}w × w × ${h} = ${k*h}w². Solve for w, find all three edges, then use 2(lw + lh + wh).`,`${k*h}w² = ${V} → w² = ${w*w} → w = ${w}; l = ${l}; A = 2(${l*w} + ${l*h} + ${w*h}) = ${A}`)}],
'Statistics & probability':[
()=>{const o=Array.from({length:6},()=>r(1,40)),s=[...o].sort((a,b)=>a-b),m=(s[2]+s[3])/2;return Q(`Find the median of ${o.join(', ')}.`,m,`Put the numbers in order. With an even number of values the median is halfway between the two middle ones.`,`Ordered: ${s.join(', ')}. Middle two: ${s[2]} and ${s[3]}, so median = ${m}`)},
()=>{let fr;do{fr=[r(2,7),r(2,7),r(2,7)];fr.push(20-fr[0]-fr[1]-fr[2])}while(fr[3]<2||fr[3]>8);const t=fr.reduce((s,q,i)=>s+q*(i+1),0);return Q(`The scores 1, 2, 3 and 4 occurred with frequencies ${fr.join(', ')} respectively. Find the mean score.`,t/20,`Multiply each score by its frequency, add the results, then divide by the total frequency (20).`,`1×${fr[0]} + 2×${fr[1]} + 3×${fr[2]} + 4×${fr[3]} = ${t}; ${t} ÷ 20 = ${f(t/20)}`)},
()=>{const R1=r(3,6),B=r(2,5),t=R1+B,p=R1*(R1-1)/(t*(t-1));return Q(`A bag holds ${R1} red counters and ${B} blue counters. Two counters are taken at random WITHOUT replacement. Find the probability that both are red. (Give a fraction, or a decimal to 3 d.p.)`,p,`After the first red counter is taken, both the number of red counters AND the total go down by 1. Multiply the two probabilities.`,`${R1}/${t} × ${R1-1}/${t-1} = ${R1*(R1-1)}/${t*(t-1)} ≈ ${f(p)}`)},
()=>{const N=[20,25][r(0,1)],n1=r(6,N-6),n2=N-n1,m1=r(40,80),m2=r(45,90),M=(n1*m1+n2*m2)/N;return Q(`Class A has ${n1} students with a mean test mark of ${m1}. Class B has ${n2} students. The mean mark for all ${N} students together is ${f(M)}. Find the mean mark of Class B.`,m2,`Total marks of everyone = overall mean × ${N}. Subtract Class A's total marks, then divide by the number of students in Class B.`,`${f(M)} × ${N} = ${n1*m1+n2*m2}; Class A total = ${n1*m1}; Class B total = ${n2*m2}; ${n2*m2} ÷ ${n2} = ${m2}`)}]
}};
/* ---------- Answer validation ---------- */
const num=s=>{s=String(s).toLowerCase().replace(/[°%£\s,]|cm|units?|degrees?|²|³/g,'').replace(/^[a-z]=/,'').replace(/^−/,'-');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);return m?m[1]/m[2]:/^-?\d*\.?\d+$/.test(s)?+s:NaN};
const norm=s=>String(s).toLowerCase().replace(/[\s*]/g,'').replace(/²/g,'^2').replace(/^[a-z]=/,'');
const pn=s=>{s=String(s).toLowerCase().replace(/[\s*]/g,'').replace(/²/g,'^2').replace(/−/g,'-').replace(/^[a-z]=/,'');if(!/^[-+0-9x^.]+$/.test(s))return null;const m={},ts=s.match(/[+-]?[^+-]+/g);if(!ts)return null;for(const t of ts){const g=t.match(/^([+-]?)(\d*\.?\d*)(x?)(?:\^(\d+))?$/);if(!g||(!g[2]&&!g[3]))return null;m[g[3]?(g[4]?+g[4]:1):0]=(m[g[3]?(g[4]?+g[4]:1):0]||0)+(g[1]=='-'?-1:1)*(g[2]===''?1:+g[2])}return Object.keys(m).filter(k=>Math.abs(m[k])>1e-9).sort().map(k=>k+':'+m[k]).join('|')||'0'};
const nl=s=>String(s).toLowerCase().replace(/[x=°%£]|cm|units?|degrees?/g,'').replace(/−/g,'-').split(/[,;]|\band\b|\bor\b|\s+/).filter(Boolean).map(num);
const check=(q,v)=>Array.isArray(q.a)?(()=>{const g=nl(v).sort((a,b)=>a-b),e=[...q.a].sort((a,b)=>a-b);return g.length==e.length&&g.every((x,i)=>Math.abs(x-e[i])<0.005)})():typeof q.a==='number'?Math.abs(num(v)-q.a)<0.005:[q.a,...(q.alt||[])].some(x=>{const a=pn(x);return norm(x)===norm(v)||(a!==null&&a===pn(v))});
/* ---------- State ---------- */
let S={v:'home',name:D.last,subj:'',diff:-1,topic:'',t:null};
const mine=()=>D.tests.filter(t=>t.student.toLowerCase()===S.name.toLowerCase());
function cheer(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),n=c.sampleRate,b=c.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.02?1:.15)*(1-i/n);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}
for(let i=0;i<28;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🐶','🎉','👏','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}
/* ---------- Views ---------- */
const V={
home:()=>`<h1>Year 8 &amp; 9 Practice Portal</h1><p class=mu>Type your answers, earn Puppies 🐶 and watch your total grow.</p><div class=card><label>Student Name<input id=nm value="${esc(S.name)}" placeholder="e.g. Smithy" autocomplete=off></label><label>Subject<select id=sb><option value="">Choose a subject…</option>${SUBJ.map(s=>`<option ${s==S.subj?'selected':''}>${s}</option>`).join('')}</select></label><p class=err id=er></p><button data-a=go>Continue</button></div>`,
subj:()=>{const tp=Object.keys(BANK[S.subj]||{}),ready=S.diff>=0&&S.topic;return `<h1>${S.subj} Practice</h1><p class=mu>Student: ${esc(S.name)}</p><div class=card><h2>Difficulty</h2><div class=chips>${DIFF.map((d,i)=>`<button class="chip ${S.diff==i?'on':''}" data-a=diff data-v=${i}>${d}<small>🐶 ${PUP[i]} ${PUP[i]>1?'Puppies':'Puppy'} per correct answer</small></button>`).join('')}</div><h2>Topic</h2>${tp.length?`<div class=chips>${tp.concat('Mixed').map(t=>`<button class="chip ${S.topic==t?'on':''}" data-a=top data-v="${esc(t)}">${t=='Mixed'?'Mixed topics (all)':t}</button>`).join('')}</div>`:`<p>${S.subj} questions aren't loaded yet. Add topics to the question bank to switch this subject on.</p>`}<button data-a=start ${ready?'':'disabled'}>Start test</button><button class=g data-a=home>Change subject</button></div>`},
test:()=>{const t=S.t,q=t.qs[t.i];return `<p><b>${esc(t.id)}</b> <span class=mu>(Set ${t.setNo} of 10)</span></p><div class=meta><span>Question ${t.i+1} of 10</span><span>${DIFF[S.diff]}</span><span>${esc(q.topic)}</span><span>🐶 ${t.pup} earned</span><span>${t.qs.filter(x=>!x.done).length} left</span></div><div class=card><h2>Question</h2><p class=q>${q.q}</p><h3>Your Answer</h3><input id=ans value="${esc(q.last||'')}" ${q.done?'disabled':''} placeholder="Type your answer" autocomplete=off><div><button data-a=chk ${q.done?'disabled':''}>Check Answer</button><button class=g data-a=exp>Explain</button><button class=g data-a=cor>Correction</button></div>${q.fb?`<p class="fb ${q.ok?'ok':'bad'}" role=status>${q.fb}</p>`:''}${q.showEx?`<div class=pn><h3>Explain</h3><p>${q.m}</p></div>`:''}${q.showCor?`<div class=pn><h3>Correction</h3><p><b>Correct answer:</b> ${esc(ans(q))}</p><p><b>Method:</b> ${q.m}</p><p><b>Working:</b> ${q.w}</p><p><b>Your answer:</b> ${q.ok?'Correct.':q.last?`You wrote "${esc(q.last)}", which doesn't match ${esc(ans(q))}. Compare it with the working above.`:'You did not enter an answer.'}</p><p class=mu>No Puppies are awarded for using Correction.</p></div>`:''}${q.done?`<button data-a=next>${t.i==9?'Finish test':'Next question'} →</button>`:''}</div>`},
done:()=>{const t=S.t.rec;return `<h1>Test Complete! 🎉</h1><div class=card><p><b>Student:</b> ${esc(t.student)}<br><b>Subject:</b> ${t.subject}<br><b>Topic:</b> ${t.topic=='Mixed'?'Mixed topics':t.topic}<br><b>Difficulty:</b> ${DIFF[t.diff]}<br><b>Test Number:</b> ${esc(t.id)}<br><b>Date:</b> ${new Date(t.date).toLocaleDateString('en-GB')}</p><p><b>Correct:</b> ${t.correct} / 10<br><b>Incorrect:</b> ${10-t.correct} / 10</p><p class=q>Total Puppies: ${t.puppies} 🐶</p><button data-a=again>New test</button><button class=g data-a=dash>Dashboard</button></div>`},
dash:()=>{const T=mine().slice().reverse(),P=T.reduce((s,t)=>s+t.puppies,0),C=T.reduce((s,t)=>s+t.correct,0),N=T.length*10,by={};T.forEach(t=>by[t.subject]=(by[t.subject]||0)+t.puppies);const rec=T.slice(0,10).reverse(),mx=Math.max(1,...rec.map(t=>t.puppies));
return `<h1>${esc(S.name)}'s Dashboard</h1><div class=stats><div class=big><span>🐶 Total Puppies</span><b>${P}</b></div><div><span>Tests completed</span><b>${T.length}</b></div><div><span>Questions answered</span><b>${N}</b></div><div><span>Correct answers</span><b>${C}</b></div><div><span>Accuracy</span><b>${N?Math.round(C/N*100):0}%</b></div></div>
<div class=card><h2>Puppies by subject</h2>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<p>${k}: <b>${v} 🐶</b></p>`).join(''):'<p class=mu>Complete a test to start earning Puppies.</p>'}<h2>Puppies per recent test</h2><div class=bars>${rec.map(t=>`<i title="${esc(t.id)}: ${t.puppies}" style="height:${t.puppies/mx*100}%"></i>`).join('')}</div></div>
<h2>Recent tests</h2><div class=wrap><table><tr><th>Date<th>Test Number<th>Subject<th>Topic<th>Difficulty<th>Correct<th>Puppies</tr>${T.map(t=>`<tr><td>${new Date(t.date).toLocaleDateString('en-GB')}<td>${esc(t.id)}<td>${t.subject}<td>${t.topic}<td>${DIFF[t.diff]}<td>${t.correct}/10<td>${t.puppies} 🐶</tr>`).join('')||'<tr><td colspan=7>No tests yet.</tr>'}</table></div>`}};
function render(){$('#nv').innerHTML=S.name&&S.v!='home'?`<button class=g data-a=home>Home</button><button class=g data-a=dash>Dashboard</button>`:S.name?`<button class=g data-a=dash>Dashboard</button>`:'';$('#app').innerHTML=V[S.v]();const i=$('#ans');if(i&&!i.disabled)i.focus();window.scrollTo(0,0)}
const cap=()=>{const i=$('#ans'),q=S.t.qs[S.t.i];if(i&&!q.done)q.last=i.value.trim();return q};
const A={
home(){S.v='home';render()},dash(){S.v='dash';render()},
go(){const n=$('#nm').value.trim(),s=$('#sb').value;if(!n||!s){$('#er').textContent=!n?'Enter your name to continue.':'Select a subject to continue.';return}S.name=n;D.last=n;save();S.subj=s;S.diff=-1;S.topic='';S.v='subj';render()},
diff(v){S.diff=+v;render()},top(v){S.topic=v;render()},
start(){const tp=S.topic,key=[S.name.toLowerCase(),S.subj,tp,S.diff].join('|'),setNo=D.tests.filter(t=>t.key==key).length%10+1;R=rng(`${S.subj}|${tp}|${S.diff}|${setNo}`);const B=BANK[S.subj],names=tp=='Mixed'?Object.keys(B):[tp],qs=[],seen=new Set;
for(let i=0;i<10;i++){const nm=names[i%names.length];let q,g=0;do q=B[nm][S.diff]();while(seen.has(q.q)&&++g<30);seen.add(q.q);qs.push({...q,topic:nm,last:'',ok:false,done:false,pts:0})}
const num=Math.max(0,...D.tests.filter(t=>t.student.toLowerCase()==S.name.toLowerCase()&&t.subject==S.subj).map(t=>t.num))+1;
S.t={i:0,qs,num,setNo,key,pup:0,id:`${S.name} - ${S.subj} - ${String(num).padStart(4,'0')}`};S.v='test';render()},
chk(){const q=cap();if(q.done)return;if(!q.last){q.fb='Type an answer first, then press Check Answer.';q.ok=false;render();return}
if(check(q,q.last)){q.ok=q.done=true;q.pts=PUP[S.diff];S.t.pup+=q.pts;q.fb=`Correct! 🎉 +${q.pts} ${q.pts>1?'Puppies':'Puppy'} 🐶`;cheer()}else q.fb='Incorrect. Try again, or press Correction to see the answer.';render()},
exp(){const q=cap();q.showEx=!q.showEx;render()},
cor(){const q=cap();q.showCor=true;if(!q.ok){q.done=true;q.fb='Answer revealed. No Puppies awarded for this question.'}render()},
next(){const t=S.t;if(t.i<9){t.i++;render();return}
const rec={id:t.id,num:t.num,key:t.key,student:S.name,subject:S.subj,topic:S.topic,diff:S.diff,setNo:t.setNo,date:new Date().toISOString(),correct:t.qs.filter(q=>q.ok).length,puppies:t.pup,questions:t.qs.map(q=>({topic:q.topic,question:q.q,correctAnswer:q.a,answer:q.last,correct:q.ok,puppies:q.pts}))};
D.tests.push(rec);save();t.rec=rec;S.v='done';render()},
again(){S.v='subj';render()}};
document.body.onclick=e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a.dataset.v)};
document.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ans')A.chk();if(e.key==='Enter'&&e.target.id==='nm')A.go()};
render();
</script></body></html>
