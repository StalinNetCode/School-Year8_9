<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Year 8 &amp; 9 Practice Portal</title>
<style>

:root[data-theme="dark"]{--bg:#15201d;--cd:#1e2c28;--tx:#f1efe6;--mu:#a9b5ad;--pr:#5cd0b5;--on:#0c1b17;--ok:#6fdc97;--bad:#ff8f86;--bd:#31443e;--ac:#f2b544}

<script>
"use strict";
/* ---------- Storage layer: this browser's copy of the results. The cloud sync further down keeps the shared copy in Supabase. ---------- */
const KEY='y8_10_portal_v1';let D={tests:[],last:''};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PUP=[1,2,4,5],DIFF=['Easy','Moderate','Difficult','Very Difficult'];
const SUBJ=['Maths','Additional Maths','Physics','Chemistry','English','Spanish','French'];
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;const r=(a,b)=>a+Math.floor(R()*(b-a+1));
const Q=(q,a,m,w,o)=>({q,a,m,w,...o});
const nums=(k,lo,hi)=>{const n=Array.from({length:k},()=>r(lo,hi));n[k-1]+=(k-n.reduce((s,x)=>s+x,0)%k)%k;return n};
const sup=(b,n)=>`${b}<sup>${n}</sup>`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const P=(...c)=>{let s='';c.forEach((k,i)=>{const p=c.length-1-i;if(!k)return;const a=Math.abs(k),m=p?(a==1?'':a)+'x'+(p==2?'²':p==3?'³':''):a;s+=(k<0?'-':s?'+':'')+m});return s||'0'};
const fx=s=>s.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/^ − /,'−');
const f=x=>+x.toFixed(4),ans=q=>q.d!=null?q.d:Array.isArray(q.a)?q.a.join(' and '):q.a;
/* ---------- Question bank: BANK[subject][topic] = [easy, moderate, difficult, very difficult].
   Each level is a LIST of question templates. A test cycles through the list in a shuffled order, so the
   10 questions use different stories and cover every part of the topic. To add a question, add a template to a list.
   Templates are seeded, so every (topic, difficulty) has 10 repeatable test sets.
   Answers may be a number, a polynomial string (any term order), or an array of numbers (any order, e.g. two roots).
   Options (5th argument of Q): d = how the answer is displayed, fmt:'f' = must be typed as a simplest-form fraction,
   fmt:'d' = must be typed as a decimal. ---------- */
const pick=a=>a[r(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d==1?`${n}`:`${n}/${d}`};
const QF=(q,n,d,m,w,o)=>Q(q,n/d,m,w,{d:frac(n,d),...o});
const gbp=p=>(p/100).toFixed(2);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const NAMES=['Aarav','Maya','Oliver','Zara','Leo','Priya','Noah','Amira','Ethan','Sofia','Kai','Hana','Daniel','Chloe','Ravi','Isla','Tomas','Meera'];
const who=(k=1)=>{const s=[];while(s.length<k){const n=pick(NAMES);if(!s.includes(n))s.push(n)}return k==1?s[0]:s};
const bk=a=>`(x ${sg(a)})`;
const cf=k=>k==1?'':k;
const BANK={Maths:{
'Fractions, decimals & percentages':[
/* Easy */[
()=>{const b=[4,5,6,8,10][r(0,4)],a=r(2,b-1),k=r(3,12),n=b*k,p=[10,20,25,50][r(0,3)],m=r(2,10)*20,v=a*k+p*m/100;return Q(`Work out ${a}/${b} of ${n}, then add ${p}% of ${m}.`,v,`Do each part separately: divide by the denominator and multiply by the numerator for the fraction; for the percentage, find 1% or use a fraction. Then add.`,`${n} ÷ ${b} × ${a} = ${a*k}; ${p}% of ${m} = ${p*m/100}; total = ${v}`)},
()=>{const b=pick([2,3,4,5]),k=pick([2,3]),d=b*k,a=r(1,b-1),c=r(1,d-1),n=a*k+c;return QF(`Work out ${a}/${b} + ${c}/${d}. Give your answer as a fraction in its simplest form.`,n,d,`Fractions can only be added when the denominators match. Change ${a}/${b} into an equivalent fraction with denominator ${d}, add the numerators, then simplify.`,`${a}/${b} = ${a*k}/${d}; ${a*k}/${d} + ${c}/${d} = ${n}/${d}${frac(n,d)!=`${n}/${d}`?` = ${frac(n,d)}`:''}`)},
()=>{const N=who(),it=pick(['notebooks','gel pens','smoothies','comics','key rings']),n=r(2,5),p=5*r(25,75),t=n*p,note=t>=1000?2000:1000;return Q(`${N} buys ${n} ${it} costing £${gbp(p)} each and pays with a £${note/100} note. How much change does ${N} get (£)?`,(note-t)/100,`Multiply the price by the number bought to get the total, then subtract the total from the money handed over. Keep the decimal points lined up.`,`${n} × £${gbp(p)} = £${gbp(t)}; £${gbp(note)} − £${gbp(t)} = £${gbp(note-t)}`,{d:gbp(note-t)})},
()=>{const b=pick([4,5,10,20,25,50]),a=r(1,b-1);return Q(`Write ${a}/${b} as a percentage.`,100*a/b,`Percent means "out of 100". Make the denominator 100 (or work out the fraction of 100).`,`${a}/${b} = ${100*a/b}/100 = ${100*a/b}%`)},
()=>{const b=pick([4,5,8,20,25]),a=r(1,b-1),v=a/b;return Q(`Write ${a}/${b} as a decimal.`,v,`A fraction is a division: divide the numerator by the denominator.`,`${a} ÷ ${b} = ${f(v)}`,{fmt:'d'})},
()=>{const A=r(110,990),B=r(110,990),C=r(50,100),v=(A+B-C)/100;return Q(`Work out ${A/100} + ${B/100} − ${C/100}.`,v,`Line up the decimal points and work from left to right: add first, then subtract.`,`${A/100} + ${B/100} = ${(A+B)/100}; ${(A+B)/100} − ${C/100} = ${v}`)},
()=>{const N=who(),b=pick([3,4,5,6,8]),a=r(1,b-1),k=r(2,9),T=b*k,th=pick(['a book','a cinema trip','a birthday present','snacks']);return Q(`${N} has £${T} and spends ${a}/${b} of it on ${th}. How much money does ${N} have left (£)?`,T-a*k,`Find the fraction of the amount (divide by the denominator, multiply by the numerator), then subtract it from the starting amount.`,`${T} ÷ ${b} × ${a} = ${a*k} spent; ${T} − ${a*k} = ${T-a*k}`)},
()=>{const T=pick([20,25,30,40,50]),p=pick([20,40,60,80]),cl=pick(['chess club','swimming club','school choir','drama group']);return Q(`A ${cl} has ${T} members and ${p}% of them are girls. How many members are boys?`,T*(100-p)/100,`If ${p}% are girls then the rest (100% − ${p}%) are boys. Find that percentage of the total.`,`100% − ${p}% = ${100-p}%; ${100-p}% of ${T} = ${T*(100-p)/100}`)}],
/* Moderate */[
()=>{const it=pick(['games console','mountain bike','phone','concert ticket','train season ticket']),p=[15,20,25,30,35,40,60][r(0,6)],o=r(2,15)*20,n=o*(100+p)/100;return Q(`The price of a ${it} rises from £${o} to £${n}. Work out the percentage increase.`,p,`% change = (change ÷ original) × 100. Always divide by the ORIGINAL amount.`,`Change = ${n} − ${o} = ${n-o}; ${n-o} ÷ ${o} × 100 = ${p}%`)},
()=>{let W,a,b,c,d;do{W=r(1,3);b=pick([2,3,4,5,6]);d=pick([2,3,4,5,6,8]);a=r(1,b-1);c=r(1,d-1)}while(b==d||gcd(a,b)>1||gcd(c,d)>1);const D=b*d,n=(W*b+a)*d-c*b;return QF(`Work out the mixed number ${W} ${a}/${b} minus ${c}/${d}. Give your answer as a fraction (an improper fraction is fine).`,n,D,`Change the mixed number into an improper fraction, write both fractions with a common denominator, subtract the numerators, then simplify.`,`${W} ${a}/${b} = ${W*b+a}/${b} = ${(W*b+a)*d}/${D}; ${c}/${d} = ${c*b}/${D}; ${(W*b+a)*d}/${D} − ${c*b}/${D} = ${n}/${D} = ${frac(n,D)}`)},
()=>{let a,b,c,d;do{b=r(3,9);a=r(1,b-1);d=r(3,9);c=r(1,d-1)}while(gcd(a,b)>1||gcd(c,d)>1||b==d);return QF(`Work out ${a}/${b} ÷ ${c}/${d}. Give your answer as a fraction in its simplest form.`,a*d,b*c,`To divide by a fraction, keep the first fraction, change ÷ to ×, and flip the second fraction. Then multiply tops and bottoms and simplify.`,`${a}/${b} × ${d}/${c} = ${a*d}/${b*c} = ${frac(a*d,b*c)}`)},
()=>{let L;do L=r(12,48);while(L%10==0);const it=pick(['Ribbon','Copper wire','Fabric','Rope']),p=10*r(6,25),c=L*p/10;return Q(`${it} costs £${gbp(p)} per metre. Find the cost of ${L/10} m (£).`,c/100,`Multiply the length by the price per metre. Ignore the decimal points, multiply as whole numbers, then put the decimal point back.`,`${L/10} × ${gbp(p)} = ${gbp(c)}`,{d:gbp(c)})},
()=>{const [v,n,d]=pick([[0.125,1,8],[0.375,3,8],[0.625,5,8],[0.875,7,8],[0.35,7,20],[0.45,9,20],[0.16,4,25],[0.44,11,25],[0.075,3,40],[0.325,13,40],[0.64,16,25],[0.85,17,20]]),dp=String(v).length-2;return QF(`Write ${v} as a fraction in its simplest form.`,n,d,`Write the decimal over ${10**dp} (because it has ${dp} decimal places), then divide top and bottom by their highest common factor.`,`${v} = ${Math.round(v*10**dp)}/${10**dp} = ${n}/${d}`,{fmt:'f'})},
()=>{const it=pick(['coat','pair of headphones','tent','guitar','skateboard']),P0=20*r(2,15),d=pick([15,20,30,35,45]),s=P0*(100-d)/100;return Q(`A ${it} normally costs £${P0}. In a sale it is reduced by ${d}%. Find the sale price (£).`,s,`Find ${d}% of the price and subtract it, or multiply by ${(100-d)/100} in one step.`,`${d}% of ${P0} = ${P0*d/100}; ${P0} − ${P0*d/100} = ${s}`)},
()=>{const [fa,fb]=pick([[1,4],[2,5],[3,8],[1,2]]),p=pick([10,20,25,30]),T=40,w=T*fa/fb,b=T*p/100;return Q(`In a class of ${T} students, ${fa}/${fb} walk to school and ${p}% come by bus. Everyone else comes by car. How many students come by car?`,T-w-b,`Work out the fraction of the class and the percentage of the class as actual numbers of students, then subtract both from the total.`,`${fa}/${fb} of ${T} = ${w}; ${p}% of ${T} = ${b}; ${T} − ${w} − ${b} = ${T-w-b}`)}],
/* Difficult */[
()=>{const it=pick(['bike','sofa','television','drum kit']),P0=r(1,8)*200,u=[10,20,30,50][r(0,3)],d=[10,20,25,50][r(0,3)],a=P0*(100+u)/100*(100-d)/100;return Q(`A ${it} costs £${P0}. Its price is increased by ${u}% and then the new price is reduced by ${d}% in a sale. Find the final price in £.`,a,`Percentage changes are applied one after another, using multipliers: ${(100+u)/100} then ${(100-d)/100}.`,`${P0} × ${(100+u)/100} × ${(100-d)/100} = ${a}. (This is not the same as a single ${u-d}% change.)`)},
()=>{const it=pick(['jacket','pair of boots','watch','suitcase']),d=pick([10,20,25,30,40]),O=r(2,30)*20,s=O*(100-d)/100;return Q(`In a sale all prices are reduced by ${d}%. The sale price of a ${it} is £${s}. What was the price before the sale (£)?`,O,`The sale price is ${100-d}% of the original, NOT the original minus ${d}% of the sale price. Divide the sale price by ${(100-d)/100} to get back to 100%.`,`${s} ÷ ${(100-d)/100} = ${O}`)},
()=>{const N=who(),a=pick([3,4,5]),b=pick([2,3,4]),k=r(1,6),T=a*b*k,L=(a-1)*(b-1)*k;return Q(`${N} spends 1/${a} of some birthday money on a game, and then spends 1/${b} of what is LEFT on a book. ${N} now has £${L}. How much birthday money did ${N} start with (£)?`,T,`The second fraction is of the remainder, not of the whole. After the game ${a-1}/${a} is left; after the book ${b-1}/${b} of that is left. Multiply these to get the fraction remaining, then work backwards.`,`${a-1}/${a} × ${b-1}/${b} = ${frac((a-1)*(b-1),a*b)} of the money is left; £${L} ÷ ${frac((a-1)*(b-1),a*b)} = £${T}`)},
()=>{let W1,a,b,W2,c,d,e,f2;do{W1=r(1,3);b=pick([2,3,4]);a=r(1,b-1);W2=r(1,2);d=pick([3,4,5,6]);c=r(1,d-1);f2=pick([3,4,5,7]);e=r(1,f2-1)}while(b==d||gcd(c,d)>1||gcd(a,b)>1||gcd(e,f2)>1);const sn=(W1*b+a)*d+(W2*d+c)*b,sd=b*d;return QF(`Work out (${W1} ${a}/${b} + ${W2} ${c}/${d}) × ${e}/${f2}, where ${W1} ${a}/${b} and ${W2} ${c}/${d} are mixed numbers. Give your answer as a fraction in its simplest form (an improper fraction is fine).`,sn*e,sd*f2,`Brackets first. Change both mixed numbers to improper fractions with a common denominator and add. Then multiply by ${e}/${f2} (tops × tops, bottoms × bottoms) and simplify.`,`${W1*b+a}/${b} + ${W2*d+c}/${d} = ${sn}/${sd}; ${sn}/${sd} × ${e}/${f2} = ${sn*e}/${sd*f2} = ${frac(sn*e,sd*f2)}`)},
()=>{let u1,u2;do{u1=r(15,60);u2=r(15,60)}while(Math.abs(u1-u2)<2);const n1=pick([4,5,6,8]),n2=pick([10,12,15]),it=pick(['pencils','bread rolls','juice cartons','batteries']);return Q(`Shop A sells a pack of ${n1} ${it} for £${gbp(n1*u1)}. Shop B sells a pack of ${n2} ${it} for £${gbp(n2*u2)}. How many pence cheaper PER ITEM is the better-value shop?`,Math.abs(u1-u2),`Find the cost of one item in each shop by dividing the pack price by the number in the pack (work in pence). Then find the difference.`,`A: ${n1*u1}p ÷ ${n1} = ${u1}p each; B: ${n2*u2}p ÷ ${n2} = ${u2}p each; difference = ${Math.abs(u1-u2)}p`)},
()=>{const [fa,fb]=pick([[3,5],[2,3],[3,4],[4,5]]),p=pick([10,20,25,50]),k=r(1,4),C=fb*20*k,w=fa*20*k,L=w*(100-p)/100;return Q(`A water tank is ${fa}/${fb} full. Then ${p}% of the water in the tank is used, leaving ${L} litres. How many litres does the tank hold when it is completely full?`,C,`Work backwards. ${L} litres is ${100-p}% of the water that was in the tank, so divide by ${(100-p)/100}. That amount is ${fa}/${fb} of the full tank, so divide by ${fa} and multiply by ${fb}.`,`${L} ÷ ${(100-p)/100} = ${w} litres before; ${w} ÷ ${fa} × ${fb} = ${C} litres`)}],
/* Very Difficult */[
()=>{const N=who(),rt=pick([10,20]),F=rt==10?121:144,dp=r(2,15)*100,fv=dp*F/100,age=r(11,13);return Q(`On ${N}'s ${age}th birthday a grandparent paid a single amount into a new savings account for ${N}. The account pays ${rt}% compound interest per year. The same bank offers a different account paying ${rt+2}% simple interest per year, but that account was not used. No money was added or taken out, and on ${N}'s ${age+2}th birthday the balance was exactly £${fv}. How much was paid in on the ${age}th birthday (£)?`,dp,`Ignore the simple-interest account: it was not used. In 2 years the money was multiplied by ${1+rt/100} twice, i.e. by ${F/100}. To go back in time, DIVIDE the final balance by ${F/100}.`,`${fv} ÷ ${F/100} = ${dp}`)},
()=>{const N=who(),it=pick(['laptop','tablet','camera','electric scooter']),k=r(2,12),O=k*100,d=pick([10,20,25,40]),red=O*(100-d)/100,pay=red*6/5,w=pick([35,49,59]);return Q(`A shop puts labels on its goods showing the price before VAT. In a sale, the label price of a ${it} is first reduced by ${d}%, and then VAT at 20% is added to the reduced price. ${N} pays £${pay} in total for the ${it}. The shop also offers a 3-year warranty for £${w}, which ${N} decides not to buy. What was the label price of the ${it} before the sale reduction (£)?`,O,`The warranty was not bought, so ignore it. Work backwards through the steps in reverse order: divide by 1.2 to remove the VAT, then divide by ${(100-d)/100} to undo the ${d}% reduction.`,`${pay} ÷ 1.2 = ${red}; ${red} ÷ ${(100-d)/100} = ${O}`)},
()=>{const [A,B,C]=who(3),a=pick([3,4,5]),p=pick([20,25,40,50]),q=pick([20,25,50,75]),k=r(1,3),T=a*400*k,rem=T*(a-1)/a,cs=rem*(100-p)/100,L=cs*(100-q)/100,ent=r(120,480);return Q(`${A}, ${B} and ${C} enter a quiz competition against ${ent} other teams and win the prize money. ${A} takes 1/${a} of the prize. ${B} then takes ${p}% of what is left, and ${C} gets the rest. ${C} immediately spends ${q/100} of ${C}'s share on a second-hand bike and has £${L} left. How much was the total prize (£)?`,T,`The number of teams does not matter. Work backwards from ${C}: £${L} is ${(100-q)/100} of ${C}'s share. ${C}'s share is ${100-p}% of what was left after ${A}. What was left after ${A} is ${a-1}/${a} of the prize.`,`${C}'s share = ${L} ÷ ${(100-q)/100} = ${cs}; left after ${A} = ${cs} ÷ ${(100-p)/100} = ${rem}; prize = ${rem} ÷ ${a-1} × ${a} = ${T}`)},
()=>{let C,fa,fb,st,u,j,used;do{C=pick([40,48,56,64]);[fa,fb]=pick([[3,4],[1,2],[5,8],[7,8]]);st=C*fa/fb;u=pick([5,6,8]);j=r(1,3);used=u*j}while(used>st-3);const N=who(),D=100*j,price=pick([140,150,160]),dz=price+pick([8,12]),need=C-st+used;return Q(`${N}'s family car has a petrol tank that holds ${C} litres. At the start of a trip the tank is ${fa}/${fb} full. The car uses ${u/100} litres of petrol for every kilometre and the trip is ${D} km long. At the end of the trip the tank is filled right to the top at a garage where petrol costs £${gbp(price)} per litre and diesel costs £${gbp(dz)} per litre. How much does it cost to fill the tank (£)?`,need*price/100,`The diesel price is not needed. Find how much petrol was in the tank at the start, subtract what the trip used, and work out how many litres are needed to reach ${C} litres. Multiply that by the petrol price.`,`Start: ${fa}/${fb} of ${C} = ${st} litres; used: ${u/100} × ${D} = ${used} litres; left: ${st-used} litres; needed: ${C} − ${st-used} = ${need} litres; ${need} × £${gbp(price)} = £${gbp(need*price)}`,{d:gbp(need*price)})},
()=>{const N=who(),T=pick([[-20,25,10,1.1],[50,-20,-25,.9],[-50,20,25,.75],[25,-40,20,.9],[60,-25,-50,.6],[20,25,-40,.9]]),I=r(2,12)*200,F=Math.round(I*T[3]),wr=T[0]+T[1]+T[2],ch=x=>x>0?`rose by ${x}%`:`fell by ${-x}%`,ml=x=>(100+x)/100;return Q(`${N}'s aunt bought some shares. In the first year their value ${ch(T[0])}, in the second year it ${ch(T[1])} and in the third year it ${ch(T[2])}. ${N} says, "That is the same as one single change of ${wr>0?'+':'−'}${Math.abs(wr)}%," but ${N} is wrong. At the end of the three years the shares were worth £${F}. How much did the aunt pay for the shares (£)?`,I,`Percentage changes cannot simply be added, because each one is a percentage of a different amount. Multiply the three multipliers together to get the overall multiplier, then divide the final value by it.`,`${ml(T[0])} × ${ml(T[1])} × ${ml(T[2])} = ${T[3]}; ${F} ÷ ${T[3]} = ${I}`)},
()=>{const N=who(),[a,b,t]=pick([[20,30,12],[30,60,20],[40,120,30],[60,120,40],[10,15,6],[12,24,8],[20,80,16],[15,30,10],[24,48,16],[30,45,18]]),cap=pick([600,900,1200]),dr=r(22,28);return Q(`A paddling pool holds ${cap} litres. The garden hose on its own fills the empty pool in ${a} minutes. The kitchen hose on its own fills it in ${b} minutes. Emptying the pool through its drain takes ${dr} minutes. ${N} starts with the pool empty and the drain closed, and turns on both hoses at the same moment. How many minutes does the pool take to fill?`,t,`The drain time and the size of the pool are not needed. In one minute the garden hose fills 1/${a} of the pool and the kitchen hose fills 1/${b}. Add these fractions to find the fraction filled each minute, then work out how many minutes make a whole pool. (The answer is NOT ${a} + ${b}, and not the average.)`,`1/${a} + 1/${b} = ${frac(a+b,a*b)} of the pool per minute; 1 ÷ ${frac(a+b,a*b)} = ${t} minutes`)}]],
'Indices':[
/* Easy */[
()=>{const b=r(2,5),n=r(2,4),c=r(2,6),m=r(2,3);return Q(`Work out ${sup(b,n)} + ${sup(c,m)}.`,b**n+c**m,`Work out each power separately (repeated multiplication), then add the results.`,`${b**n} + ${c**m} = ${b**n+c**m}`)},
()=>{const b=r(2,9),a=r(2,7),c=r(2,7);return Q(`${sup(b,a)} × ${sup(b,c)} can be written as a single power, ${sup(b,'n')}. What is n?`,a+c,`When you MULTIPLY powers of the same base, ADD the indices.`,`${a} + ${c} = ${a+c}, so the answer is ${sup(b,a+c)}`)},
()=>{const b=r(2,9),c=r(2,5),a=c+r(2,6);return Q(`${sup(b,a)} ÷ ${sup(b,c)} can be written as a single power, ${sup(b,'n')}. What is n?`,a-c,`When you DIVIDE powers of the same base, SUBTRACT the indices.`,`${a} − ${c} = ${a-c}, so the answer is ${sup(b,a-c)}`)},
()=>{const a=r(2,9),m=r(2,12),k=r(2,9);return Q(`Work out ${sup(a,0)} + ${sup(m,1)} + ${sup(k,2)}.`,1+m+k*k,`Anything to the power 0 is 1. Anything to the power 1 is itself. A power of 2 means the number multiplied by itself.`,`1 + ${m} + ${k*k} = ${1+m+k*k}`)},
()=>{const s=r(2,12),c=r(2,5);return Q(`Work out √${s*s} + ∛${c**3}.`,s+c,`A square root asks "what number times itself gives this?". A cube root asks "what number used three times in a multiplication gives this?".`,`√${s*s} = ${s}; ∛${c**3} = ${c}; ${s} + ${c} = ${s+c}`)}],

()=>{const b=r(2,9),a=r(2,4),c=r(2,4),d=r(1,6);return Q(`(${sup(b,a)})<sup>${c}</sup> × ${sup(b,d)} = ${sup(b,'n')}. Find n.`,a*c+d,`First multiply the indices in the bracket (power of a power), then add the indices when multiplying.`,`${a}×${c} = ${a*c}, then ${a*c} + ${d} = ${a*c+d}`)},
()=>{const b=pick([2,3,4,5,10]),n=r(1,3);return QF(`Work out ${sup(b,'−'+n)}. Give your answer as a fraction.`,1,b**n,`A negative index means "one over". ${sup(b,'−'+n)} = 1 ÷ ${sup(b,n)}. It does NOT make the answer negative.`,`${sup(b,n)} = ${b**n}, so ${sup(b,'−'+n)} = 1/${b**n}`)},
()=>{const b=r(2,9),a=r(2,6),c=r(2,6),d=r(3,9);return Q(`(${sup(b,a)} × ${sup(b,c)}) ÷ ${sup(b,d)} = ${sup(b,'n')}. Find n. (n may be negative.)`,a+c-d,`Add the indices for the multiplication, then subtract the index you are dividing by.`,`${a} + ${c} = ${a+c}; ${a+c} − ${d} = ${a+c-d}`)},
()=>{let m;do m=r(12,98);while(m%10==0);let n;do n=r(-5,6);while(!n);const s=n>0?String(m*10**(n-1)):'0.'+'0'.repeat(-n-1)+m;return Q(`The number ${s} is written in standard form as ${m/10} × ${sup(10,'n')}. Find n.`,n,`Count how many places the decimal point must move to get from ${m/10} to the number. Moving it right (a big number) gives a positive n; moving it left (a small number) gives a negative n.`,`${m/10} → ${s} needs the point to move ${Math.abs(n)} place${Math.abs(n)>1?'s':''} to the ${n>0?'right':'left'}, so n = ${n}`)},
()=>{const b=pick([2,3,4,5]),n=r(3,b==2?10:b==3?5:4);return Q(`${sup(b,'n')} = ${b**n}. Find n.`,n,`Keep multiplying by ${b} and count how many ${b}s you have used until you reach ${b**n}.`,`${Array.from({length:n},()=>b).join(' × ')} = ${b**n}, so n = ${n}`)}],
/* Difficult */[
()=>{const T=[[8,3,2,4],[27,3,2,9],[16,2,3,64],[81,4,3,27],[125,3,2,25],[32,5,2,4],[49,2,3,343],[64,3,2,16],[64,2,3,512],[16,4,3,8]],[b,d,n,v]=T[r(0,9)];return Q(`Work out ${sup(b,n+'/'+d)}.`,v,`In a fractional index the denominator is a root and the numerator is a power. Take the root first, then the power.`,`The root (denominator ${d}) of ${b} is ${Math.round(b**(1/d))}; then raise to the power ${n}: ${v}`)},
()=>{const [a,b]=pick([[2,3],[3,4],[2,5],[3,5],[1,2],[1,3],[4,5]]),n=pick([2,3]);return QF(`Work out (${a}/${b})<sup>−${n}</sup>. Give your answer as a fraction or a whole number.`,b**n,a**n,`A negative index flips the fraction (takes the reciprocal). Then apply the power to both the top and the bottom.`,`(${a}/${b})<sup>−${n}</sup> = (${b}/${a})<sup>${n}</sup> = ${b**n}/${a**n}${a==1?` = ${b**n}`:''}`)},
()=>{const a=r(2,9),b=r(2,9),p=r(2,7),q=r(2,7),n=p+q+(a*b>=10?1:0);return Q(`(${a} × ${sup(10,p)}) × (${b} × ${sup(10,q)}) = k × ${sup(10,'n')}, where the answer is in standard form (so k is at least 1 but less than 10). Find n.`,n,`Multiply the numbers and add the indices. If the number part comes out as 10 or more, it is not yet in standard form: divide it by 10 and add 1 to the index.`,`${a} × ${b} = ${a*b}; ${sup(10,p)} × ${sup(10,q)} = ${sup(10,p+q)}; ${a*b} × ${sup(10,p+q)}${a*b>=10?` = ${a*b/10} × ${sup(10,n)}`:''}, so n = ${n}`)},
()=>{const b=pick([2,3,5]),c=r(3,6),a=r(1,2*c-2);return Q(`Solve ${sup(b,'x')} × ${sup(b,a)} = ${sup(b*b,c)}.`,2*c-a,`Write everything as a power of ${b}. Since ${b*b} = ${sup(b,2)}, the right-hand side is ${sup(b,2*c)}. Then add the indices on the left and equate.`,`${sup(b,`x + ${a}`)} = ${sup(b,2*c)}, so x + ${a} = ${2*c}, x = ${2*c-a}`)},
()=>{const s=pick([3,5,10,25]),h=pick([2,3,4]),k=r(3,6),th=pick(['bacteria in a dish','cells in a sample','yeast cells in a jar']);return Q(`The number of ${th} doubles every ${h} hours. At the start there are ${s}. How many are there after ${h*k} hours?`,s*2**k,`Work out how many times the number doubles (total time ÷ ${h}). Doubling ${k} times means multiplying by ${sup(2,k)}, not by ${2*k}.`,`${h*k} ÷ ${h} = ${k} doublings; ${s} × ${sup(2,k)} = ${s} × ${2**k} = ${s*2**k}`)}],
/* Very Difficult */[
()=>{let a,x,m,k;do{a=r(2,4);x=r(2,6);m=r(3,7);k=2*m-a*x}while(!k||Math.abs(k)>8);return Q(`Solve ${sup(2,`${a}x ${sg(k)}`)} = ${sup(4,m)}.`,x,`Write both sides with the same base: 4 = 2², so 4<sup>${m}</sup> = 2<sup>${2*m}</sup>. Then equate the indices and solve.`,`${a}x ${sg(k)} = ${2*m}, so ${a}x = ${2*m-k}, x = ${x}`)},
()=>{const N=who(),T=pick([1,2,3,5,8,10,20]);let n=0;while(2**n<=100*T)n++;return Q(`${N} reads that a sheet of A4 paper is 0.1 mm thick, 210 mm wide and 297 mm long. Each time the sheet is folded in half its thickness doubles, so after 1 fold it is 0.2 mm thick and after 2 folds it is 0.4 mm thick. Imagine the paper could be folded as many times as you like. What is the smallest number of folds that makes the folded paper MORE than ${T} cm thick?`,n,`The width and length are not needed. Change ${T} cm into mm first. After n folds the thickness is 0.1 × ${sup(2,'n')} mm, so you need ${sup(2,'n')} to be bigger than ${100*T}. Test powers of 2.`,`${T} cm = ${10*T} mm. ${sup(2,n-1)} = ${2**(n-1)} gives ${2**(n-1)/10} mm (not enough); ${sup(2,n)} = ${2**n} gives ${2**n/10} mm, so ${n} folds`)},
()=>{const y=r(1,5),d=r(1,3),x=y+d;return Q(`Given that ${sup(2,'x')} × ${sup(2,'y')} = ${2**(x+y)} and ${sup(3,'x')} ÷ ${sup(3,'y')} = ${3**d}, find the value of x × y.`,x*y,`Write ${2**(x+y)} as a power of 2 and ${3**d} as a power of 3. The index laws then give two equations: one for x + y and one for x − y. Solve them together, then multiply x by y.`,`${2**(x+y)} = ${sup(2,x+y)}, so x + y = ${x+y}; ${3**d} = ${sup(3,d)}, so x − y = ${d}; adding: 2x = ${2*x}, x = ${x}, y = ${y}; x × y = ${x*y}`)},
()=>{const N=who(),[pl,b,q]=pick([['the Sun',1.5,8],['Mars',2.4,8],['Jupiter',7.8,8],['Saturn',1.5,9],['Neptune',4.5,9]]),t=Math.round(b*10**q/3e5);return Q(`${N} is making a poster about space and writes down three facts. Light travels at about 3 × ${sup(10,5)} km per second. The Moon is about 3.84 × ${sup(10,5)} km from Earth. On the day of the poster, ${pl} is about ${b} × ${sup(10,q)} km from Earth. Using these figures, how many seconds does light take to travel from ${pl} to Earth?`,t,`The Moon's distance is not needed. Time = distance ÷ speed. Divide the number parts and SUBTRACT the indices, then write the result as an ordinary number.`,`(${b} × ${sup(10,q)}) ÷ (3 × ${sup(10,5)}) = ${f(b/3)} × ${sup(10,q-5)} = ${t} seconds`)},
()=>{const [p,i1,dn]=pick([[27,'−2/3',9],[8,'−2/3',4],[16,'−3/4',8],[25,'−1/2',5],[64,'−2/3',16],[4,'−3/2',8]]),[q,i2,v]=pick([[9,'3/2',27],[4,'5/2',32],[16,'3/2',64],[8,'4/3',16],[81,'3/4',27]]);return QF(`Work out ${sup(p,i1)} × ${sup(q,i2)}. Give your answer as a fraction in its simplest form or as a whole number.`,v,dn,`Deal with each power separately. For a fractional index, take the root (denominator) first and then the power (numerator). A negative index means "one over". Then multiply and simplify.`,`${sup(p,i1)} = 1/${dn}; ${sup(q,i2)} = ${v}; 1/${dn} × ${v} = ${frac(v,dn)}`)}]],
'Expressions & formulae':[
/* Easy */[
()=>{const a=r(2,6),b=r(1,9),c=r(2,6),d=r(1,9),e=P(a+c,a*b-c*d);return Q(`Expand and simplify ${a}(x + ${b}) + ${c}(x − ${d}).`,e,`Expand each bracket by multiplying every term inside, then collect like terms (x terms together, numbers together).`,`${a}x + ${a*b} + ${c}x − ${c*d} = ${fx(e)}`)},
()=>{const a=r(2,6),b=r(2,6),x=r(2,9),y=r(2,9);return Q(`Find the value of ${a}x + ${b}y when x = ${x} and y = ${y}.`,a*x+b*y,`Replace each letter with its number. ${a}x means ${a} × x. Multiply first, then add.`,`${a} × ${x} + ${b} × ${y} = ${a*x} + ${b*y} = ${a*x+b*y}`)},
()=>{const a=r(2,9),c=r(2,9),b=r(5,15),d=r(1,4),e=P(a+c,b-d);return Q(`Simplify ${a}x + ${b} + ${c}x − ${d}.`,e,`Collect like terms: add the x terms together and combine the plain numbers together.`,`${a}x + ${c}x = ${a+c}x; ${b} − ${d} = ${b-d}; answer ${fx(e)}`)},
()=>{const N=who(),fx0=r(2,5),p=r(2,4),m=r(3,12);return Q(`A taxi charges a fixed fee of £${fx0} plus £${p} for every mile. Using the formula C = ${fx0} + ${p}m, find the cost C of ${N}'s ${m}-mile journey (£).`,fx0+p*m,`Substitute the number of miles for m. Multiply before you add.`,`C = ${fx0} + ${p} × ${m} = ${fx0} + ${p*m} = ${fx0+p*m}`)},
()=>{const a=r(2,9),b=r(2,6),c=r(1,9),e=P(a*b,-a*c);return Q(`Expand ${a}(${b}x − ${c}).`,e,`Multiply EVERY term inside the bracket by the number outside.`,`${a} × ${b}x = ${a*b}x; ${a} × −${c} = −${a*c}; answer ${fx(e)}`)}],

()=>{const p=r(2,3),a=r(1,9),b=r(1,9),s=r(0,1)?1:-1,e=P(p,p*s*b+a,s*a*b);return Q(`Expand and simplify (${p}x + ${a})(x ${s>0?'+':'−'} ${b}).`,e,`Multiply every term in the first bracket by every term in the second (FOIL), then collect like terms.`,`${p}x² + (${p*s*b})x + ${a}x + (${s*a*b}) = ${fx(e)}`)},

()=>{const C=5*r(2,44),th=pick(['An oven is set to','A kiln is heated to','A science experiment needs']);return Q(`The formula F = 9C/5 + 32 changes a temperature from °C to °F. ${th} ${C} °C. What is this in °F?`,9*C/5+32,`Substitute C into the formula: multiply by 9, divide by 5, then add 32.`,`9 × ${C} ÷ 5 = ${9*C/5}; ${9*C/5} + 32 = ${9*C/5+32}`)},
()=>{const c=r(2,5),a=c+r(1,4),b=r(1,9),d=r(1,9),e=P(a-c,a*b+c*d);return Q(`Expand and simplify ${a}(x + ${b}) − ${c}(x − ${d}).`,e,`Expand both brackets. The second bracket is multiplied by −${c}, so −${c} × −${d} gives a POSITIVE number.`,`${a}x + ${a*b} − ${c}x + ${c*d} = ${fx(e)}`)},
()=>{const a=r(2,5),b=r(1,9),c=r(1,4),d=r(1,9),e=P(2*(a+c),2*(b+d));return Q(`A rectangle has a length of (${a}x + ${b}) cm and a width of (${c==1?'':c}x + ${d}) cm. Write an expression for its perimeter in cm. Expand and simplify your answer.`,e,`Perimeter = 2 × length + 2 × width. Expand both brackets and collect like terms.`,`2(${a}x + ${b}) + 2(${c==1?'':c}x + ${d}) = ${2*a}x + ${2*b} + ${2*c}x + ${2*d} = ${fx(e)}`)}],

()=>{const h=2*r(2,8),a=r(3,12),b=r(3,12),A=h*(a+b)/2;return Q(`The area of a trapezium is A = ½h(a + b). Find b when A = ${A}, h = ${h} and a = ${a}.`,b,`Rearrange first: multiply both sides by 2, divide by h, then subtract a. Then substitute.`,`b = 2A ÷ h − a = ${2*A} ÷ ${h} − ${a} = ${b}`)},
()=>{const a=r(2,5),b=r(1,7),s=r(0,1)?1:-1,e=P(a*a,2*a*b*s,b*b);return Q(`Expand and simplify (${a}x ${s>0?'+':'−'} ${b})².`,e,`Squaring a bracket means multiplying it by itself: (${a}x ${s>0?'+':'−'} ${b})(${a}x ${s>0?'+':'−'} ${b}). It is NOT just ${a*a}x² ${'+'} ${b*b}: there is a middle term too.`,`${a*a}x² ${s>0?'+':'−'} ${a*b}x ${s>0?'+':'−'} ${a*b}x + ${b*b} = ${fx(e)}`)},
()=>{const [u,v]=pick([[3,5],[5,13],[6,10],[0,8],[2,6],[4,10],[1,7],[5,11],[3,9],[7,25]]),K=(v*v-u*u)/2,ds=[];for(let s=2;s<=K/2;s++)if(K%s==0)ds.push(s);const s=pick(ds),a=K/s;return Q(`A formula used in physics is v² = u² + 2as. Find the value of a when v = ${v}, u = ${u} and s = ${s}.`,a,`Substitute the numbers, then solve for a: subtract u² from both sides and divide by 2s.`,`${v*v} = ${u*u} + 2 × a × ${s}; ${v*v-u*u} = ${2*s}a; a = ${a}`)},
()=>{const p=r(2,3),a=r(1,6),b=r(2,6),c=r(1,5),e=P(p-1,p*b+a-c,a*b);return Q(`A rectangular lawn measures (${p}x + ${a}) m by (x + ${b}) m. A rectangular patio measuring x m by (x + ${c}) m is cut out of it. Write an expression for the area of lawn that remains, in m². Expand and simplify your answer.`,e,`Area of lawn = (${p}x + ${a})(x + ${b}). Area of patio = x(x + ${c}). Expand both, then subtract EVERY term of the patio area.`,`(${fx(P(p,p*b+a,a*b))}) − (${fx(P(1,c,0))}) = ${fx(e)}`)},
()=>{const u=r(2,12),t=r(2,6),a=2*pick([-3,-2,-1,1,2,3,4,5]),s=u*t+a*t*t/2;return Q(`The formula s = ut + ½at² gives the distance travelled. Find s when u = ${u}, a = ${a<0?'−'+(-a):a} and t = ${t}.`,s,`Substitute carefully. Square t BEFORE multiplying by ½a. ${a<0?'Because a is negative, the second part is subtracted.':''}`,`${u} × ${t} = ${u*t}; ½ × (${a}) × ${t*t} = ${a*t*t/2}; s = ${u*t} + (${a*t*t/2}) = ${s}`)}],
/* Very Difficult */[
()=>{const a=r(1,6),b=r(1,6),c=r(1,5),e=P(5,3*a-2*b-2*c,-a*b-c*c);return Q(`Expand and simplify (2x + ${a})(3x − ${b}) − (x + ${c})².`,e,`Expand the double bracket, expand the squared bracket as (x + ${c})(x + ${c}), then SUBTRACT every term of the second result.`,`(${fx(P(6,3*a-2*b,-a*b))}) − (${fx(P(1,2*c,c*c))}) = ${fx(e)}`)},
()=>{const a=r(2,4),b=r(1,9),c=r(2,3),d=r(1,6),e2=r(1,4),e=P(a*c-1,b*c-a*d-2*e2,-b*d-e2*e2),far=r(200,900),g=r(2,4);return Q(`A farmer's rectangular field is (${a}x + ${b}) m long and (${c}x − ${d}) m wide. A square barn with sides of (x + ${e2}) m stands inside the field. The farmer also rents a second field ${far} m down the road, and the fence around the first field has ${g} gates. Write an expression for the area of the first field that is NOT covered by the barn, in m². Expand and simplify your answer.`,e,`The second field and the gates do not matter. Area left = field area − barn area = (${a}x + ${b})(${c}x − ${d}) − (x + ${e2})². Expand both parts, then subtract EVERY term of the barn's area.`,`(${fx(P(a*c,b*c-a*d,-b*d))}) − (${fx(P(1,2*e2,e2*e2))}) = ${fx(e)}`)},
()=>{const N=who(),c=pick([20,30,40,50]),h=pick([25,30,35,40,45]),t=r(2,8),B=(c+h*t)*6/5,mi=r(6,25);return Q(`An electrician charges a call-out fee of £${c} plus £${h} for each hour worked. VAT at 20% is then added to the whole bill. The electrician drives ${mi} miles to reach ${N}'s house, but does not charge for travel. ${N}'s final bill, including VAT, is £${B}. How many hours did the electrician work?`,t,`The miles driven do not matter. Write the formula: Bill = 1.2 × (${c} + ${h}t). Undo it in reverse order: divide by 1.2, subtract the call-out fee, then divide by the hourly rate.`,`${B} ÷ 1.2 = ${c+h*t}; ${c+h*t} − ${c} = ${h*t}; ${h*t} ÷ ${h} = ${t}`)},
()=>{let a,b,c;do{a=r(-4,5);b=r(-4,5);c=r(1,5)}while(!a||!b);const e=P(1,a+b+c,a*b+b*c+c*a,a*b*c);return Q(`Expand and simplify ${bk(a)}${bk(b)}${bk(c)}.`,e,`Expand the first two brackets and simplify. Then multiply EVERY term of that result by each term of the third bracket, and collect like terms.`,`${bk(a)}${bk(b)} = ${fx(P(1,a+b,a*b))}; then (${fx(P(1,a+b,a*b))})${bk(c)} = ${fx(e)}`)},
()=>{const [N,M]=who(2),a=r(1,6),b=r(2,9),age=r(11,15),g=r(3,20),e=P(4,4*a-b,a*a);return Q(`${N} thinks of a number, x. ${N} doubles it, adds ${a}, and then squares the whole result. ${M}, who is ${age}, guesses that the number is ${g}, but the guess is wrong and is not needed. From the squared result, ${N} then subtracts ${b} times the number first thought of. Write a simplified expression, in terms of x, for ${N}'s final answer.`,e,`Ignore ${M}'s age and guess. Build the expression step by step: double and add gives (2x + ${a}); squaring gives (2x + ${a})²; then subtract ${b}x. Expand the squared bracket fully (it has a middle term) and collect like terms.`,`(2x + ${a})² − ${b}x = ${fx(P(4,4*a,a*a))} − ${b}x = ${fx(e)}`)},
()=>{const a=r(2,5),b=r(1,6),e=P(4*a*b,0);return Q(`Expand and simplify (${a}x + ${b})² − (${a}x − ${b})².`,e,`Expand each squared bracket separately (each has three terms), then subtract EVERY term of the second expansion. Watch the signs: many terms cancel.`,`(${fx(P(a*a,2*a*b,b*b))}) − (${fx(P(a*a,-2*a*b,b*b))}) = ${fx(e)}`)}]],
'Solving equations':[
/* Easy */[
()=>{const a=r(2,9),x=r(2,12),b=r(1,Math.min(15,a*x-1)),v=a*x-b;return Q(`Solve ${a}x − ${b} = ${v}.`,x,`Undo the subtraction first (add ${b} to both sides), then undo the multiplication (divide by ${a}).`,`${a}x = ${v} + ${b} = ${a*x}, so x = ${x}`)},
()=>{const a=r(2,6),k=r(2,9),b=r(1,9);return Q(`Solve x/${a} + ${b} = ${k+b}.`,a*k,`Subtract ${b} from both sides first, then multiply both sides by ${a}.`,`x/${a} = ${k}, so x = ${k} × ${a} = ${a*k}`)},
()=>{const N=who(),a=r(2,7),x=r(3,12),b=r(2,15);return Q(`${N} thinks of a number, multiplies it by ${a} and then adds ${b}. The answer is ${a*x+b}. What number did ${N} think of?`,x,`Work backwards, undoing each step in reverse order: subtract ${b}, then divide by ${a}.`,`${a*x+b} − ${b} = ${a*x}; ${a*x} ÷ ${a} = ${x}`)},
()=>{const N=who(),t=r(6,12),b=r(1,3),n=r(2,8);return Q(`Cinema tickets cost £${t} each, and there is one £${b} booking fee for the whole order. ${N}'s order costs £${t*n+b} altogether. How many tickets did ${N} buy?`,n,`Write an equation: ${t}n + ${b} = ${t*n+b}. Subtract the booking fee, then divide by the ticket price.`,`${t*n+b} − ${b} = ${t*n}; ${t*n} ÷ ${t} = ${n}`)},
()=>{const a=r(2,8),b=r(1,9),x=r(1,10);return Q(`Solve ${a}(x + ${b}) = ${a*(x+b)}.`,x,`Either divide both sides by ${a} first, or expand the bracket. Then subtract.`,`x + ${b} = ${x+b}, so x = ${x}`)}],
/* Moderate */[
()=>{const c=r(1,4),a=c+r(2,4),b=r(1,7),x=r(2,9),d=(a-c)*x+a*b;return Q(`Solve ${a}(x + ${b}) = ${c}x + ${d}.`,x,`Expand the bracket, collect the x terms on one side and the numbers on the other, then divide.`,`${a}x + ${a*b} = ${c}x + ${d} → ${a-c}x = ${d-a*b} → x = ${x}`)},
()=>{let a,b,c,x,d;do{c=r(2,5);a=c+r(1,4);b=r(1,15);x=r(-6,9);d=(a-c)*x+b}while(!x||!d);return Q(`Solve ${a}x + ${b} = ${c}x ${sg(d)}. (The answer may be negative.)`,x,`Subtract ${c}x from both sides so that x appears on one side only, then subtract ${b} and divide.`,`${a-c}x + ${b} = ${d}; ${a-c}x = ${d-b}; x = ${x}`)},
()=>{const [A,B]=who(2),k=r(2,4),bAge=r(5,12),y=r(2,6),S=(k+1)*bAge+2*y;return Q(`${A} is ${k} times as old as ${B}. In ${y} years' time their two ages will add up to ${S}. How old is ${B} now?`,bAge,`Let ${B}'s age now be x, so ${A} is ${k}x. In ${y} years BOTH of them are ${y} years older, so (x + ${y}) + (${k}x + ${y}) = ${S}.`,`${k+1}x + ${2*y} = ${S}; ${k+1}x = ${S-2*y}; x = ${bAge}`)},
()=>{const a=r(2,4),b=r(1,8),c=r(1,3),d=r(1,8),x=r(2,9),Pm=2*((a+c)*x+b+d);return Q(`A rectangle has length (${a}x + ${b}) cm and width (${c==1?'':c}x + ${d}) cm. Its perimeter is ${Pm} cm. Find x.`,x,`Perimeter = 2 × (length + width). Form an equation, simplify and solve.`,`2(${a+c}x + ${b+d}) = ${Pm}; ${a+c}x + ${b+d} = ${Pm/2}; ${a+c}x = ${Pm/2-b-d}; x = ${x}`)},
()=>{let a,x,c,d,b;do{a=r(2,5);x=r(2,9);c=r(2,6);d=r(2,9);b=c*d-a*x}while(!b||Math.abs(b)>20);return Q(`Solve (${a}x ${sg(b)})/${c} = ${d}.`,x,`Multiply both sides by ${c} to remove the fraction, then solve the two-step equation.`,`${a}x ${sg(b)} = ${c*d}; ${a}x = ${c*d-b}; x = ${x}`)}],
/* Difficult */[
()=>{let x=r(1,8),p=r(2,6),q=r(2,6),m=r(5,9);while(q==p)q=r(2,6);const a=p*m-x,b=q*m-x;return Q(`Solve (x + ${a})/${p} = (x + ${b})/${q}.`,x,`Cross-multiply to remove the fractions (multiply both sides by ${p*q}), expand, then solve.`,`${q}(x + ${a}) = ${p}(x + ${b}) → ${q}x + ${q*a} = ${p}x + ${p*b} → ${q-p}x = ${p*b-q*a} → x = ${x}`)},
()=>{const mid=2*r(5,30)+1;return Q(`Three consecutive ODD numbers add up to ${3*mid}. What is the largest of the three numbers?`,mid+2,`Consecutive odd numbers go up in 2s. Call them n, n + 2 and n + 4, add them, and solve. Remember the question asks for the LARGEST.`,`3n + 6 = ${3*mid}; n = ${mid-2}; the numbers are ${mid-2}, ${mid}, ${mid+2}`)},
()=>{const N=who(),a=r(3,12),b=r(2,10),T=20*a+50*b;return Q(`${N} has ${a+b} coins in a money box. Every coin is either a 20p or a 50p, and together they are worth £${gbp(T)}. How many 50p coins are there?`,b,`Let the number of 50p coins be x, so there are (${a+b} − x) 20p coins. Work in pence: 50x + 20(${a+b} − x) = ${T}.`,`50x + ${20*(a+b)} − 20x = ${T}; 30x = ${T-20*(a+b)}; x = ${b}`)},
()=>{let a,b,c,d,x,e;do{c=r(2,4);a=c+r(1,4);b=r(1,6);d=r(1,6);x=r(-5,10);e=a*(x-b)-c*(x+d)}while(!x);return Q(`Solve ${a}(x − ${b}) − ${c}(x + ${d}) = ${e<0?'−'+(-e):e}. (The answer may be negative.)`,x,`Expand both brackets (the second is multiplied by −${c}), collect like terms, then solve.`,`${a}x − ${a*b} − ${c}x − ${c*d} = ${e}; ${a-c}x − ${a*b+c*d} = ${e}; ${a-c}x = ${e+a*b+c*d}; x = ${x}`)},
()=>{const [p,q,s,t]=pick([[2,3,1,2],[3,2,1,3],[2,1,3,4],[1,4,2,3],[3,4,2,1],[2,5,3,2]]),C=r(3,5),A=C+r(3,7),pl=pick(['zoo','museum','theme park','castle']);return Q(`At a ${pl}, ${p} adult ticket${p>1?'s':''} and ${q} child ticket${q>1?'s':''} cost £${p*A+q*C} in total. ${s} adult ticket${s>1?'s':''} and ${t} child ticket${t>1?'s':''} cost £${s*A+t*C} in total. How much is ONE adult ticket (£)?`,A,`Write two equations using a for an adult ticket and c for a child ticket. Multiply the equations so that the number of c's matches, then subtract to eliminate c.`,`${p}a + ${q}c = ${p*A+q*C} and ${s}a + ${t}c = ${s*A+t*C}; solving gives a = ${A} and c = ${C}`)}],
/* Very Difficult */[
()=>{const m=r(1,9);let n=r(-9,9);while(!n||n==m/2)n=r(-9,9);const e=P(2,-(2*n+m),m*n);return Q(`Solve ${fx(e)} = 0. Give both solutions (for example: 2 and −3).`,[m/2,n],`Factorise into two brackets, set each bracket equal to zero, and solve. Remember a quadratic usually has TWO solutions.`,`(2x − ${m})(x ${n<0?'+':'−'} ${Math.abs(n)}) = 0, so x = ${m/2} or x = ${n}`)},
()=>{let n,k,y,m;do{n=r(9,16);k=r(3,4);y=r(2,n-3);m=(k*n-y)/(n-y)}while(m%1||m<=k||m>9);const [N,M]=who(2),d=r(2,4),g=k*n+r(22,30);return Q(`${N}'s father is now ${k} times as old as ${N}. ${y} years ago he was ${m} times as old as ${N} was then. ${N}'s sister ${M} is ${d} years younger than ${N}, and their grandmother is ${g}. How old is ${N}'s father now?`,k*n,`The sister and grandmother are not needed. Let ${N}'s age now be x, so the father is ${k}x. ${y} years ago they were (x − ${y}) and (${k}x − ${y}). Write the equation ${k}x − ${y} = ${m}(x − ${y}), solve for x, then remember the question asks for the FATHER's age.`,`${k}x − ${y} = ${m}x − ${m*y}; ${m*y-y} = ${m-k}x; x = ${n}; father = ${k} × ${n} = ${k*n}`)},
()=>{const w=r(3,12),a=r(2,9),A=w*(w+a),yrs=r(2,6),c=r(4,9);return Q(`A rectangular lawn is ${a} m longer than it is wide and has an area of ${A} m². The lawn was laid ${yrs} years ago, when turf cost £${c} per m². A new edging strip is going to be fitted around the whole outside edge of the lawn. How many metres of edging are needed?`,2*(2*w+a),`The age of the lawn and the cost of turf are not needed. Let the width be w, so the length is w + ${a} and w(w + ${a}) = ${A}. Rearrange to w² + ${a}w − ${A} = 0 and factorise (a length cannot be negative). Then find the PERIMETER, not the width.`,`(w − ${w})(w + ${w+a}) = 0, so w = ${w}; length = ${w+a}; perimeter = 2(${w} + ${w+a}) = ${2*(2*w+a)}`)},
()=>{const [p,q,s,t]=pick([[2,3,1,2],[3,2,1,3],[2,1,3,4],[1,4,2,3],[3,4,2,1],[2,5,3,2]]),pn2=5*r(7,19),nb=10*r(12,26),ru=r(8,20),sh=pick(['school shop','stationery stall','corner shop']);return Q(`A ${sh} sells pens and notebooks. On Monday it sells ${p} pen${p>1?'s':''} and ${q} notebook${q>1?'s':''} to one customer for £${gbp(p*pn2+q*nb)}. On Tuesday another customer pays £${gbp(s*pn2+t*nb)} for ${s} pen${s>1?'s':''} and ${t} notebook${t>1?'s':''}. On Wednesday the shop sells ${ru} rulers at 45p each and no pens at all. Prices did not change during the week. What is the total cost, in pence, of ONE pen and ONE notebook together?`,pn2+nb,`Wednesday's ruler sales are not needed. Work in pence. Write an equation for Monday and one for Tuesday using p for a pen and n for a notebook, then solve them together (elimination). Finally add the two prices.`,`${p}p + ${q}n = ${p*pn2+q*nb} and ${s}p + ${t}n = ${s*pn2+t*nb}; solving gives p = ${pn2} and n = ${nb}; total = ${pn2+nb}p`)},
()=>{let x,a,c,e,b,d,f2,g=0;do{x=r(2,12);a=r(2,3);c=pick([2,3,4,5,6]);e=pick([2,3,4,5]);b=r(1,9);d=r(-6,9);f2=(a*x+b)/c-(x-d)/e}while((a*x+b)%c||(((x-d)%e)+e)%e||!d||c==e||a*e==c||x==d);return Q(`Solve (${a}x + ${b})/${c} − (x ${sg(-d)})/${e} = ${f2<0?'−'+(-f2):f2}.`,x,`Multiply EVERY term by ${c*e} to clear both fractions. Put brackets around each numerator, and take care with the minus sign in front of the second bracket when you expand.`,`${e}(${a}x + ${b}) − ${c}(x ${sg(-d)}) = ${f2*c*e}; ${a*e}x + ${e*b} − ${c}x ${sg(c*d)} = ${f2*c*e}; ${a*e-c}x = ${f2*c*e-e*b-c*d}; x = ${x}`)},
()=>{const N=who(),[u,v,l]=pick([[10,15,30],[12,18,36],[12,20,60],[15,20,60],[16,24,48],[20,30,60]]),j=r(1,2),d=l*j/2,T=d/u+d/v,hm=`${Math.floor(T)} hour${Math.floor(T)>1?'s':''}${T%1?' 30 minutes':''}`,bus=Math.round(d*1.5);return Q(`${N} cycles from home to a lake at a steady ${v} km/h. After a swim, ${N} cycles home along the same route but, being tired, only manages ${u} km/h. The swim is not included, and the cycling takes ${hm} in total. A bus covers the same route one way in ${bus} minutes. How far is it from ${N}'s home to the lake (km)?`,d,`The bus is not needed. Let the distance be d km. Time = distance ÷ speed, so the two cycling times are d/${v} and d/${u} hours, and d/${v} + d/${u} = ${T}. Clear the fractions and solve. (You cannot just average the two speeds.)`,`Multiply by ${l}: ${l/v}d + ${l/u}d = ${T*l}; ${l/v+l/u}d = ${T*l}; d = ${d}`)}]],
'Linear graphs':[
/* Easy */[
()=>{const m=(r(0,1)?1:-1)*r(1,5),dx=r(2,5),x1=r(-3,4),y1=r(0,12),x2=x1+dx,y2=y1+m*dx;return Q(`Find the gradient of the line through (${x1}, ${y1}) and (${x2}, ${y2}).`,m,`Gradient = change in y ÷ change in x. A line going DOWN from left to right has a negative gradient.`,`(${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${m*dx} ÷ ${dx} = ${m}`)},
()=>{let c;do c=r(-9,9);while(!c);const m=r(2,6),k=r(1,8);return Q(`A line has equation y = ${m}x ${sg(c)}. Find the value of y when x = ${k}.`,m*k+c,`Substitute the x value into the equation: multiply by ${m} first, then ${c<0?'subtract':'add'}.`,`y = ${m} × ${k} ${sg(c)} = ${m*k+c}`)},
()=>{const m=5*r(4,12),c=5*r(4,16),jb=pick(['plumber','electrician','gardener','decorator']);return Q(`The cost, £y, of hiring a ${jb} for x hours is given by y = ${m}x + ${c}. What is the fixed call-out charge, in £ (the cost when x = 0)?`,c,`In y = mx + c, the number on its own (c) is the y-intercept: the value of y when x is 0. The number multiplying x is the gradient (cost per hour).`,`When x = 0, y = ${m} × 0 + ${c} = ${c}`)},
()=>{const m=(r(0,1)?1:-1)*r(2,6),c=r(1,12);return Q(`What is the gradient of the line y = ${c} ${sg(m)}x?`,m,`The gradient is the number multiplying x, wherever it appears in the equation. It is not always the first number written.`,`Rewrite as y = ${m}x + ${c}: the gradient is ${m}`)},
()=>{const m=r(2,6),c=r(1,10),x=r(2,9);return Q(`A point lies on the line y = ${m}x + ${c} and has a y-coordinate of ${m*x+c}. What is its x-coordinate?`,x,`Put the y value into the equation and solve for x: subtract ${c}, then divide by ${m}.`,`${m*x+c} = ${m}x + ${c}; ${m}x = ${m*x}; x = ${x}`)}],
/* Moderate */[
()=>{const m=r(-5,5)||2,x1=r(1,6),y1=r(-5,12),c=y1-m*x1;return Q(`A straight line has gradient ${m} and passes through the point (${x1}, ${y1}). Find where the line crosses the y-axis (the value of c in y = mx + c).`,c,`Substitute the gradient and the point into y = mx + c, then solve for c.`,`${y1} = ${m}×${x1} + c, so c = ${y1} − (${m*x1}) = ${c}`)},
()=>{const b=r(2,5),k=r(1,4),s=r(0,1)?1:-1,a=s*b*k,c=b*r(1,6);return Q(`Find the gradient of the line ${a<0?'−'+(-a):a}x + ${b}y = ${c}.`,-s*k,`Rearrange into the form y = mx + c: move the x term to the other side, then divide EVERYTHING by ${b}. The gradient is the number multiplying x.`,`${b}y = ${-a}x + ${c}; y = ${-s*k}x + ${c/b}; gradient = ${-s*k}`)},
()=>{const m=(r(0,1)?1:-1)*r(2,5),k=r(1,9),x1=r(1,5),y1=r(-4,10),c=y1-m*x1;return Q(`A line is parallel to y = ${m}x + ${k} and passes through the point (${x1}, ${y1}). Find its y-intercept (c).`,c,`Parallel lines have the SAME gradient, so the new line is y = ${m}x + c. Substitute the point to find c.`,`${y1} = ${m} × ${x1} + c; c = ${y1} − (${m*x1}) = ${c}`)},
()=>{let x0;do x0=r(-6,6);while(!x0);const m=(r(0,1)?1:-1)*r(2,5),c=-m*x0;return Q(`The line y = ${m}x ${sg(c)} crosses the x-axis at a point. What is the x-coordinate of that point?`,x0,`On the x-axis, y = 0. Put y = 0 into the equation and solve for x. (Do not confuse this with the y-intercept.)`,`0 = ${m}x ${sg(c)}; ${m}x = ${-c}; x = ${x0}`)},
()=>{const rt=r(2,4),fxd=r(2,5),d1=r(2,4),d2=d1+r(2,5);return Q(`A taxi fare graph is a straight line. A ${d1}-mile journey costs £${fxd+rt*d1} and a ${d2}-mile journey costs £${fxd+rt*d2}. Find the gradient of the graph, which is the cost in £ of each extra mile.`,rt,`Gradient = change in cost ÷ change in distance.`,`(${fxd+rt*d2} − ${fxd+rt*d1}) ÷ (${d2} − ${d1}) = ${rt*(d2-d1)} ÷ ${d2-d1} = ${rt}`)}],
/* Difficult */[
()=>{const m=r(2,5),x1=m*r(1,4),y1=r(1,9),k=r(1,9);return Q(`A line is perpendicular to y = ${m}x + ${k} and passes through (${x1}, ${y1}). Find the y-intercept (c) of this line.`,y1+x1/m,`Perpendicular gradients multiply to −1, so the new gradient is −1/${m}. Then substitute the point into y = mx + c.`,`m = −1/${m}; ${y1} = (−1/${m})×${x1} + c → c = ${y1} + ${x1/m} = ${y1+x1/m}`)},
()=>{const m=(r(0,1)?1:-1)*r(1,4),c=r(-8,8),x1=r(1,4),x2=x1+r(1,4),y1=m*x1+c,y2=m*x2+c;return Q(`A straight line passes through the points (${x1}, ${y1}) and (${x2}, ${y2}). Find its y-intercept.`,c,`First find the gradient (change in y ÷ change in x). Then substitute one of the points into y = mx + c to find c.`,`m = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${m}; ${y1} = ${m} × ${x1} + c; c = ${c}`)},
()=>{const m=(r(0,1)?1:-1)*r(2,4),x0=r(-5,5),d1=r(1,3),d2=r(4,6),A=[x0+d1,m*d1],B=[x0+d2,m*d2];return Q(`A straight line passes through (${A[0]}, ${A[1]}) and (${B[0]}, ${B[1]}). Find the x-coordinate of the point where the line crosses the x-axis.`,x0,`Find the gradient, then the equation of the line (y = mx + c). The line crosses the x-axis where y = 0, so set y = 0 and solve.`,`m = ${m}; c = ${A[1]} − (${m} × ${A[0]}) = ${-m*x0}; 0 = ${m}x ${sg(-m*x0)||''}; x = ${x0}`)},
()=>{const b=r(2,5),m=(r(0,1)?1:-1)*r(2,4),k=r(1,9),c=b*r(2,6);return Q(`The line ax + ${b}y = ${c} is parallel to the line y = ${m}x + ${k}. Find the value of a.`,-m*b,`Rearrange ax + ${b}y = ${c} into y = … form: its gradient is −a/${b}. Parallel lines have equal gradients, so −a/${b} = ${m}.`,`−a/${b} = ${m}, so a = ${-m*b}`)},
()=>{const x=r(4,15),df=r(1,3),pb=r(1,4),pa=pb+df,fa=r(5,12),fb=fa+x*df;return Q(`Phone plan A costs £${fa} a month plus £${pa} for each GB of data. Plan B costs £${fb} a month plus £${pb} for each GB. For how many GB of data do the two plans cost exactly the same?`,x,`Write each cost as a straight-line equation in x (GB): A = ${fa} + ${pa}x, B = ${fb} + ${pb}x. The plans cost the same where the two lines cross, so set them equal.`,`${fa} + ${pa}x = ${fb} + ${pb}x; ${df}x = ${fb-fa}; x = ${x}`)}],
/* Very Difficult */[
()=>{const x=r(-3,6),a=r(2,5),b=r(1,6)*(r(0,1)?1:-1),c=r(2,4),y=a*x+b,d=y+c*x;return Q(`The lines y = ${a}x ${sg(b)} and ${c}x + y = ${d} cross at point P. Find x + y at P.`,x+y,`At the crossing point both equations are true. Substitute the first equation into the second to find x, then find y.`,`${c}x + (${a}x ${sg(b)}) = ${d} → ${a+c}x = ${d-b} → x = ${x}; y = ${y}; x + y = ${x+y}`)},
()=>{let p,q;do{p=r(2,12);q=r(2,12)}while(p*q%2||p==q);const g=gcd(p,q),cm=pick([2,4,5]);return Q(`A map uses a coordinate grid on which 1 unit stands for 1 km, and the grid lines are printed ${cm} cm apart. A straight road follows the line ${q/g==1?'':q/g}x + ${p/g==1?'':p/g}y = ${p*q/g}. A farmer owns all the land in the triangle enclosed by the road, the x-axis and the y-axis. What is the area of the farmer's land, in km²?`,p*q/2,`The printed spacing of the grid lines does not matter. Find where the road crosses each axis: put y = 0 to get the x-intercept and x = 0 to get the y-intercept. These give the base and height of a right-angled triangle.`,`y = 0 gives x = ${p}; x = 0 gives y = ${q}; area = ½ × ${p} × ${q} = ${p*q/2}`)},
()=>{const m=pick([2,3,4])*(r(0,1)?1:-1),xm=Math.abs(m)*r(-2,3),ym=r(-4,8),d=r(1,3),A=[xm-d,ym-m*d],B=[xm+d,ym+m*d],c=ym+xm/m,C=[r(-9,9),r(-9,9)];return Q(`On a map with a coordinate grid, village A is at (${A[0]}, ${A[1]}) and village B is at (${B[0]}, ${B[1]}). A straight pipeline is laid so that every point on it is exactly the same distance from A as it is from B (it is the perpendicular bisector of AB). A third village, C, at (${C[0]}, ${C[1]}), is not connected to anything. At what y-coordinate does the pipeline cross the y-axis?`,c,`Village C is not needed. The pipeline passes through the MIDPOINT of AB and is PERPENDICULAR to AB. Find the midpoint, find the gradient of AB, take the negative reciprocal for the pipeline's gradient, then use y = mx + c.`,`Midpoint = (${xm}, ${ym}); gradient of AB = ${m}; pipeline gradient = ${m<0?'':'−'}1/${Math.abs(m)}; c = ${ym} ${sg(xm/m)||''} = ${c}`)},
()=>{const N=who(),t=r(2,6),rB=pick([0.5,1,1.5]),df=pick([0.5,1,1.5,2]),rA=rB+df,h=r(4,12),HA=h+rA*t,HB=h+rB*t;return Q(`${N} lights two candles at exactly the same time. The red candle is ${HA} cm tall, cost £${gbp(r(25,45)*10)} and burns down at a steady ${rA} cm per hour. The white candle is ${HB} cm tall, cost £${gbp(r(15,24)*10)} and burns down at a steady ${rB} cm per hour. At one moment both candles are exactly the same height. What is that height, in cm?`,h,`The prices are not needed. Write the height of each candle as a straight-line equation in t hours: red = ${HA} − ${rA}t, white = ${HB} − ${rB}t. Set them equal to find WHEN they match, then substitute back to find the HEIGHT (the question does not ask for the time).`,`${HA} − ${rA}t = ${HB} − ${rB}t; ${HA-HB} = ${df}t; t = ${t}; height = ${HA} − ${rA} × ${t} = ${h}`)},
()=>{const m=(r(0,1)?1:-1)*r(2,3),x1=r(-4,2),y1=r(-5,8),d2=r(2,4),d3=d2+r(2,5),x2=x1+d2,y2=y1+m*d2,k=x1+d3,y3=y1+m*d3,S=[r(-9,9),r(-9,9)];return Q(`A drone flies in a perfectly straight line over a field that is marked out with a coordinate grid. It passes directly over a gate at (${x1}, ${y1}), then a tree at (${x2}, ${y2}), and then a barn at (k, ${y3}). A scarecrow stands at (${S[0]}, ${S[1]}), but the drone does not fly over it. Find the value of k.`,k,`The scarecrow is not needed. All three points are on one straight line, so the gradient between any two of them is the same. Find the gradient from the gate to the tree, then use it from the tree to the barn.`,`Gradient = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${m}; from the tree, y changes by ${y3-y2}, so x changes by ${(y3-y2)/m}; k = ${x2} + ${(y3-y2)/m} = ${k}`)}]],
'Angle properties':[
/* Easy */[
()=>{const a=2*r(10,80);return Q(`An isosceles triangle has an angle of ${a}° between its two equal sides. Find the size of one of the other two angles (°).`,(180-a)/2,`The two base angles are equal and all three angles add up to 180°.`,`(180 − ${a}) ÷ 2 = ${(180-a)/2}°`)},
()=>{const a=r(25,155);return Q(`Two angles sit next to each other on a straight line. One of them is ${a}°. Find the other (°).`,180-a,`Angles on a straight line add up to 180°.`,`180 − ${a} = ${180-a}°`)},
()=>{const a=r(30,80),b=r(30,80);return Q(`Two angles of a triangle are ${a}° and ${b}°. Find the third angle (°).`,180-a-b,`The three angles in any triangle add up to 180°.`,`180 − ${a} − ${b} = ${180-a-b}°`)},
()=>{const a=r(60,110),b=r(60,110),c=r(60,110);return Q(`Three angles of a quadrilateral are ${a}°, ${b}° and ${c}°. Find the fourth angle (°).`,360-a-b-c,`The four angles in any quadrilateral add up to 360°.`,`360 − ${a} − ${b} − ${c} = ${360-a-b-c}°`)},
()=>{const a=r(35,145);return Q(`A straight line crosses two parallel lines. The two co-interior (allied) angles lie between the parallel lines on the same side. One of them is ${a}°. Find the other (°).`,180-a,`Co-interior (allied) angles between parallel lines add up to 180°. They are NOT equal, unlike alternate or corresponding angles.`,`180 − ${a} = ${180-a}°`)},
()=>{const a=r(80,150),b=r(70,120);return Q(`Three angles meet at a point and fill the whole turn around it. Two of them are ${a}° and ${b}°. Find the third (°).`,360-a-b,`Angles around a point add up to 360°.`,`360 − ${a} − ${b} = ${360-a-b}°`)}],

()=>{const e=[40,36,30,24,20,18,15,12][r(0,7)],I=180-e;return Q(`Each interior angle of a regular polygon is ${I}°. How many sides does it have?`,360/e,`Exterior angle = 180° − interior angle, and the exterior angles of any polygon add up to 360°. Sides = 360 ÷ exterior angle.`,`Exterior = 180 − ${I} = ${e}°; 360 ÷ ${e} = ${360/e}`)},
()=>{const n=r(5,12);return Q(`Find the sum of the interior angles of a polygon with ${n} sides (°).`,(n-2)*180,`A polygon with n sides can be split into (n − 2) triangles, each with angles adding to 180°.`,`(${n} − 2) × 180 = ${(n-2)*180}°`)},
()=>{const n=pick([5,6,8,9,10,12,15,18,20,24]);return Q(`Find the size of one exterior angle of a regular polygon with ${n} sides (°).`,360/n,`The exterior angles of any polygon add up to 360°. In a regular polygon they are all equal.`,`360 ÷ ${n} = ${360/n}°`)},
()=>{const [a,b,c]=pick([[1,2,3],[2,3,4],[1,1,2],[2,3,5],[3,4,5],[1,3,5],[2,2,5],[1,4,5],[3,5,7]]),s=a+b+c;return Q(`The three angles of a triangle are in the ratio ${a} : ${b} : ${c}. Find the size of the largest angle (°).`,180/s*c,`Add the parts of the ratio, divide 180° by that total to find one part, then multiply by the largest part.`,`${a} + ${b} + ${c} = ${s} parts; 180 ÷ ${s} = ${180/s}° per part; ${c} × ${180/s} = ${180/s*c}°`)},
()=>{const a=r(35,70),b=r(40,75);return Q(`In triangle ABC, side BC is extended beyond C to a point D. Angle ACD (the exterior angle) is ${a+b}° and angle BAC is ${a}°. Find angle ABC (°).`,b,`An exterior angle of a triangle equals the sum of the two interior angles at the OTHER two corners.`,`${a+b} − ${a} = ${b}°`)}],
/* Difficult */[
()=>{let a,c,e,b,d,S;do{a=r(1,4);c=r(1,4);e=r(1,4);b=r(1,20);d=r(1,20);S=a+c+e}while((180-b-d)%S||(180-b-d)/S<8);const x=(180-b-d)/S,A=[a*x+b,c*x+d,e*x];return Q(`The angles in a triangle are (${a}x + ${b})°, (${c}x + ${d})° and (${e}x)°. Find the size of the largest angle (°).`,Math.max(...A),`The three angles add to 180°. Form an equation, solve for x, then work out each angle and pick the largest.`,`${S}x + ${b+d} = 180 → x = ${x}. Angles: ${A.join('°, ')}°`)},
()=>{let a,c,e,b,d,S;do{a=r(1,4);c=r(1,4);e=r(1,3);b=r(1,25);d=r(1,25);S=a+c+e}while((270-b-d)%S||(270-b-d)/S<12||Math.max(a,c,e)*(270-b-d)/S>150);const x=(270-b-d)/S;return Q(`A quadrilateral has one right angle. Its other three angles are (${a}x + ${b})°, (${c}x + ${d})° and (${e}x)°. Find the value of x.`,x,`The angles in a quadrilateral add to 360°. A right angle is 90°, so the other three add to 270°. Form an equation and solve.`,`${S}x + ${b+d} + 90 = 360; ${S}x = ${270-b-d}; x = ${x}`)},
()=>{const n=pick([8,9,10,12,15,18,20,24,30,36]);return Q(`Find the size of one interior angle of a regular polygon with ${n} sides (°).`,180-360/n,`Find the exterior angle first (360 ÷ number of sides), then subtract from 180° because interior + exterior = 180°.`,`360 ÷ ${n} = ${360/n}°; 180 − ${360/n} = ${180-360/n}°`)},
()=>{const a=2*r(10,50);return Q(`Triangle ABC is isosceles with AB = AC, and angle BAC = ${a}°. The side BC is extended beyond C to a point D. Find angle ACD (°).`,90+a/2,`Find the two equal base angles first. Angle ACD and angle ACB lie on a straight line, so they add to 180°.`,`Angle ACB = (180 − ${a}) ÷ 2 = ${(180-a)/2}°; angle ACD = 180 − ${(180-a)/2} = ${90+a/2}°`)},
()=>{const b=r(10,350),bb=b<180?b+180:b-180,pad=x=>String(x).padStart(3,'0');return Q(`The bearing of a lighthouse from a boat is ${pad(b)}°. Find the bearing of the boat from the lighthouse (°).`,bb,`A back bearing points in exactly the opposite direction: add 180° if the bearing is less than 180°, or subtract 180° if it is 180° or more.`,`${b} ${b<180?'+':'−'} 180 = ${pad(bb)}°`)}],

()=>{const k=[2,3,4,5,8,11,17][r(0,6)];return Q(`Each interior angle of a regular polygon is ${k} times the size of each exterior angle. How many sides does the polygon have?`,2*(k+1),`Let the exterior angle be e. Interior + exterior = 180°, so ${k}e + e = 180°. Then use 360 ÷ e for the number of sides.`,`${k+1}e = 180, e = ${180/(k+1)}°; sides = 360 ÷ ${180/(k+1)} = ${2*(k+1)}`)},
()=>{const NM={3:'equilateral triangle',4:'square',5:'regular pentagon',6:'regular hexagon',8:'regular octagon',9:'regular nonagon (9 sides)',10:'regular decagon (10 sides)',12:'regular dodecagon (12 sides)'},ks=Object.keys(NM).map(Number);let n,m;do{n=pick(ks);m=pick(ks)}while(n>=m);const i1=180-360/n,i2=180-360/m,cm=r(8,25),N=who();return Q(`${N} is designing a floor pattern. One tile is a ${NM[n]} and a second tile is a ${NM[m]}. Every side of both tiles is ${cm} cm long, and the tiles cost £${gbp(r(12,40)*10)} each. The two tiles are placed flat on the floor so that they share one complete side, without overlapping. At one end of the shared side there is a gap between the two tiles. What is the size of the angle of that gap (°)?`,360-i1-i2,`The side length and the price do not matter. Find the interior angle of each regular shape (180° − 360° ÷ number of sides). At the end of the shared side, the two interior angles and the gap together make a full turn of 360°.`,`${NM[n]}: ${i1}°; ${NM[m]}: ${i2}°; gap = 360 − ${i1} − ${i2} = ${360-i1-i2}°`)},
()=>{let x,a,c,b;do{x=r(70,80);a=r(8,30);c=r(8,30);b=7*x+a+c-540}while(b<4||b>40);const A=[x,x+a,2*x-b,2*x,x+c],per=r(18,40);return Q(`A flower bed is in the shape of a pentagon with a perimeter of ${per} m. Its five interior angles are x°, (x + ${a})°, (2x − ${b})°, 2x° and (x + ${c})°. Find the size of the LARGEST angle (°).`,Math.max(...A),`The perimeter is not needed. The interior angles of a pentagon add up to (5 − 2) × 180° = 540°. Add the five expressions, solve for x, then work out EVERY angle before choosing the largest.`,`7x + ${a+c-b} = 540; x = ${x}; angles: ${A.join('°, ')}°`)},
()=>{const a=r(30,80),c=r(100,170),d1=r(5,20),d2=r(5,20),sp=r(12,24),pad=x=>String(x).padStart(3,'0');return Q(`A ship leaves port A and sails ${d1} km on a bearing of ${pad(a)}° to a buoy B. At B it turns and sails ${d2} km on a bearing of ${pad(c)}° to a lighthouse C. The ship travels at ${sp} km/h throughout. Find the size of angle ABC, the angle at the buoy between the two legs of the journey (°).`,a+180-c,`The distances and the speed are not needed. Draw a north line at B. The bearing of A FROM B is the back bearing, ${a} + 180 = ${a+180}°. The bearing of C from B is ${c}°. Angle ABC is the difference between these two directions.`,`Back bearing of A from B = ${a+180}°; ${a+180} − ${c} = ${a+180-c}°`)},
()=>{let B,x,c,d,a,b,A;do{B=r(40,75);x=r(5,15);c=r(1,4);d=B-c*x;a=r(1,3);A=180-2*B;b=A-a*x}while(d<1||b<1);const wd=r(6,12);return Q(`The frame of a roof is an isosceles triangle ABC with AB = AC, and the roof is ${wd} m wide at its base BC. Angle BAC at the top is (${cf(a)}x + ${b})° and angle ABC at one bottom corner is (${cf(c)}x + ${d})°. Find the size of angle ACB (°).`,B,`The width of the roof is not needed. Because AB = AC, the two base angles (ABC and ACB) are equal. So (${cf(a)}x + ${b}) + 2(${cf(c)}x + ${d}) = 180. Solve for x, then substitute into the base angle.`,`${a+2*c}x + ${b+2*d} = 180; x = ${x}; angle ACB = ${c} × ${x} + ${d} = ${B}°`)}]],
'Volume & surface area':[
/* Easy */[
()=>{const l=r(2,8)*10,w=r(2,6)*10,h=r(1,5)*10,v=l*w*h/1000;return Q(`A fish tank is ${l} cm long, ${w} cm wide and ${h} cm tall. How many litres of water does it hold when completely full? (1 litre = 1000 cm³)`,v,`Find the volume in cm³ (length × width × height), then divide by 1000 to change to litres.`,`${l}×${w}×${h} = ${l*w*h} cm³; ÷ 1000 = ${v} litres`)},
()=>{const s=r(2,12);return Q(`A cube has edges of length ${s} cm. Find its total surface area (cm²).`,6*s*s,`A cube has 6 identical square faces. Find the area of one face and multiply by 6.`,`${s} × ${s} = ${s*s}; 6 × ${s*s} = ${6*s*s}`)},
()=>{const l=r(4,12),w=r(2,8),h=r(2,6);return Q(`A cuboid measures ${l} cm by ${w} cm by ${h} cm. Find its total surface area (cm²).`,2*(l*w+l*h+w*h),`A cuboid has three pairs of identical faces. Find the area of each different face, add them, and double.`,`2 × (${l*w} + ${l*h} + ${w*h}) = ${2*(l*w+l*h+w*h)}`)},
()=>{const a=r(2,6),b=r(2,5),c=r(2,4);return Q(`A box measures ${2*a} cm by ${2*b} cm by ${2*c} cm. How many cubes with 2 cm edges are needed to fill it completely?`,a*b*c,`Work out how many cubes fit along each edge (divide each length by 2), then multiply the three numbers.`,`${a} × ${b} × ${c} = ${a*b*c}`)},
()=>{const l=r(4,12),w=r(2,8),h=r(2,9);return Q(`A cuboid has a volume of ${l*w*h} cm³. It is ${l} cm long and ${w} cm wide. Find its height (cm).`,h,`Volume = length × width × height, so height = volume ÷ (length × width).`,`${l} × ${w} = ${l*w}; ${l*w*h} ÷ ${l*w} = ${h}`)}],

()=>{const a=r(3,8),b=r(9,14),h=2*r(2,5),l=r(4,10),v=(a+b)*(h/2)*l;return Q(`A prism has a trapezium as its cross-section. The parallel sides of the trapezium are ${a} cm and ${b} cm, and the distance between them is ${h} cm. The prism is ${l} cm long. Find its volume (cm³).`,v,`Area of a trapezium = ½(a + b)h. Volume of a prism = cross-section area × length.`,`½ × (${a} + ${b}) × ${h} = ${(a+b)*h/2} cm²; × ${l} = ${v} cm³`)},
()=>{const b=2*r(2,6),h=r(3,9),l=r(5,15);return Q(`A triangular prism has a triangular end with base ${b} cm and perpendicular height ${h} cm. The prism is ${l} cm long. Find its volume (cm³).`,b*h/2*l,`Area of a triangle = ½ × base × height. Volume of a prism = area of the end × length.`,`½ × ${b} × ${h} = ${b*h/2} cm²; × ${l} = ${b*h/2*l} cm³`)},
()=>{const rd=r(2,9),h=r(3,12);return Q(`A cylinder has radius ${rd} cm and height ${h} cm. Its volume can be written as kπ cm³. Find the value of k.`,rd*rd*h,`Volume of a cylinder = π × radius² × height. Leave π as a symbol and just work out the number in front of it.`,`π × ${rd}² × ${h} = ${rd*rd} × ${h} × π = ${rd*rd*h}π`)},
()=>{let L,W,D,R;do{L=pick([10,12,20,25]);W=pick([4,5,6,8]);D=pick([1,2]);R=pick([4,5,8,10])}while(L*W*D%R);return Q(`A swimming pool is a cuboid ${L} m long, ${W} m wide and ${D} m deep. It is filled by a pump that delivers ${R} m³ of water every hour. How many hours does it take to fill the empty pool?`,L*W*D/R,`Find the volume of the pool, then divide by the amount of water pumped in each hour.`,`${L} × ${W} × ${D} = ${L*W*D} m³; ${L*W*D} ÷ ${R} = ${L*W*D/R} hours`)},
()=>{const k=r(1,3),l=r(5,12);return Q(`A triangular prism has ends that are right-angled triangles with sides ${3*k} cm, ${4*k} cm and ${5*k} cm. The prism is ${l} cm long. Find its total surface area (cm²).`,12*k*k+12*k*l,`There are 5 faces: two triangles and three rectangles. The right angle is between the ${3*k} cm and ${4*k} cm sides. Each rectangle has one side equal to the length of the prism.`,`Triangles: 2 × ½ × ${3*k} × ${4*k} = ${12*k*k}; rectangles: (${3*k} + ${4*k} + ${5*k}) × ${l} = ${12*k*l}; total = ${12*k*k+12*k*l}`)}],

()=>{const s=r(2,4),l=s+r(3,8),w=s+r(2,7),h=r(4,12);return Q(`A solid block measures ${l} cm by ${w} cm by ${h} cm. A square hole of side ${s} cm is cut straight through the block, from top to bottom (height ${h} cm). Find the volume of the remaining solid (cm³).`,l*w*h-s*s*h,`Find the volume of the whole block, then subtract the volume of the square hole (also a cuboid).`,`${l}×${w}×${h} = ${l*w*h}; hole = ${s}×${s}×${h} = ${s*s*h}; ${l*w*h} − ${s*s*h} = ${l*w*h-s*s*h}`)},
()=>{const rd=r(2,8),h=r(3,12);return Q(`A solid cylinder has radius ${rd} cm and height ${h} cm. Its TOTAL surface area can be written as kπ cm². Find the value of k.`,2*rd*(rd+h),`Total surface area = two circles (2πr²) plus the curved surface (2πrh). Leave π as a symbol.`,`2 × π × ${rd}² = ${2*rd*rd}π; 2 × π × ${rd} × ${h} = ${2*rd*h}π; total = ${2*rd*(rd+h)}π`)},
()=>{const s=r(2,9);return Q(`The total surface area of a cube is ${6*s*s} cm². Find the volume of the cube (cm³).`,s**3,`Divide the surface area by 6 to get the area of one face. Square-root that to get the edge length, then cube it.`,`${6*s*s} ÷ 6 = ${s*s}; √${s*s} = ${s}; ${s}³ = ${s**3}`)},
()=>{const a=r(6,12),b=r(5,10),c=r(2,a-2),d=r(2,b-2),L=r(4,12);return Q(`The cross-section of a prism is an L-shape, made by cutting a ${c} cm by ${d} cm rectangle from one corner of a ${a} cm by ${b} cm rectangle. The prism is ${L} cm long. Find its volume (cm³).`,(a*b-c*d)*L,`Find the area of the L-shape (big rectangle minus the piece cut away), then multiply by the length of the prism.`,`${a} × ${b} − ${c} × ${d} = ${a*b-c*d} cm²; × ${L} = ${(a*b-c*d)*L} cm³`)},
()=>{const [s,l,w,rise]=pick([[6,12,9,2],[4,8,4,2],[4,16,8,0.5],[4,8,8,1],[10,25,20,2],[10,50,20,1],[10,25,16,2.5],[6,18,12,1],[6,9,8,3],[6,24,18,0.5]]),dp=s+r(2,6);return Q(`A tank with a rectangular base ${l} cm by ${w} cm contains water to a depth of ${dp} cm. A solid metal cube with ${s} cm edges is lowered in until it rests on the bottom, completely under water. No water spills. By how many cm does the water level rise?`,rise,`The cube pushes aside a volume of water equal to its own volume. That water spreads over the base of the tank, so rise = volume of cube ÷ area of base.`,`${s}³ = ${s**3} cm³; base = ${l} × ${w} = ${l*w} cm²; ${s**3} ÷ ${l*w} = ${rise} cm`)}],

test:()=>{const t=S.t,q=t.qs[t.i];return `<p><b>${esc(t.id)}</b> <span class=mu>(Set ${t.setNo} of 10)</span></p><div class=meta><span>Question ${t.i+1} of 10</span><span>${DIFF[S.diff]}</span><span>${esc(q.topic)}</span><span>🐶 ${t.pup} earned</span><span>${t.qs.filter(x=>!x.done).length} left</span></div><div class=card><h2>Question</h2><p class=q>${q.q}</p><h3>Your Answer</h3><input id=ans value="${esc(q.last||'')}" ${q.done?'disabled':''} placeholder="Type your answer" autocomplete=off>${typeof q.a==='string'?'<p class=mu>Type powers with ^, for example 3x^2 - 5x + 2.</p>':''}<div><button data-a=chk ${q.done?'disabled':''}>Check Answer</button><button class=g data-a=exp>Explain</button><button class=g data-a=cor>Correction</button></div>${q.fb?`<p class="fb ${q.ok?'ok':'bad'}" role=status>${q.fb}</p>`:''}${q.showEx?`<div class=pn><h3>Explain</h3><p>${q.m}</p></div>`:''}${q.showCor?`<div class=pn><h3>Correction</h3><p><b>Correct answer:</b> ${esc(ans(q))}</p><p><b>Method:</b> ${q.m}</p><p><b>Working:</b> ${q.w}</p><p><b>Your answer:</b> ${q.ok?'Correct.':q.last?`You wrote "${esc(q.last)}", which doesn't match ${esc(ans(q))}. Compare it with the working above.`:'You did not enter an answer.'}</p><p class=mu>No Puppies are awarded for using Correction.</p></div>`:''}${q.done?`<button data-a=next>${t.i==9?'Finish test':'Next question'} →</button>`:''}</div>`},
done:()=>{const t=S.t.rec;return `<h1>Test Complete! 🎉</h1><div class=card><p><b>Student:</b> ${esc(t.student)}<br><b>Subject:</b> ${t.subject}<br><b>Topic:</b> ${t.topic=='Mixed'?'Mixed topics':t.topic}<br><b>Difficulty:</b> ${DIFF[t.diff]}<br><b>Test Number:</b> ${esc(t.id)}<br><b>Date:</b> ${new Date(t.date).toLocaleDateString('en-GB')}</p><p><b>Correct:</b> ${t.correct} / 10<br><b>Incorrect:</b> ${10-t.correct} / 10</p><p class=q>Total Puppies: ${t.puppies} 🐶</p><button data-a=again>New test</button><button class=g data-a=dash>Dashboard</button></div>`},
dash:()=>{const T=mine().slice().reverse(),P=T.reduce((s,t)=>s+t.puppies,0),C=T.reduce((s,t)=>s+t.correct,0),N=T.length*10,by={},wt=pend().length;T.forEach(t=>by[t.subject]=(by[t.subject]||0)+t.puppies);const rec=T.slice(0,10).reverse(),mx=Math.max(1,...rec.map(t=>t.puppies));
return `<h1>${esc(S.name)}'s Dashboard</h1>${wt?`<p class=mu>${wt} result${wt>1?'s are':' is'} saved on this device and will upload when the internet is back.</p>`:''}<div class=stats><div class=big><span>🐶 Total Puppies</span><b>${P}</b></div><div><span>Tests completed</span><b>${T.length}</b></div><div><span>Questions answered</span><b>${N}</b></div><div><span>Correct answers</span><b>${C}</b></div><div><span>Accuracy</span><b>${N?Math.round(C/N*100):0}%</b></div></div>
<div class=card><h2>Puppies by subject</h2>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<p>${k}: <b>${v} 🐶</b></p>`).join(''):'<p class=mu>Complete a test to start earning Puppies.</p>'}<h2>Puppies per recent test</h2><div class=bars>${rec.map(t=>`<i title="${esc(t.id)}: ${t.puppies}" style="height:${t.puppies/mx*100}%"></i>`).join('')}</div></div>
<h2>Recent tests</h2><div class=wrap><table><tr><th>Date<th>Test Number<th>Subject<th>Topic<th>Difficulty<th>Correct<th>Puppies</tr>${T.map(t=>`<tr><td>${new Date(t.date).toLocaleDateString('en-GB')}<td>${esc(t.id)}<td>${t.subject}<td>${t.topic}<td>${DIFF[t.diff]}<td>${t.correct}/10<td>${t.puppies} 🐶</tr>`).join('')||'<tr><td colspan=7>No tests yet.</tr>'}</table></div>`}};
function render(){$('#nv').innerHTML=S.ok?`${S.v!='home'?'<button class=g data-a=home>Home</button>':''}<button class=g data-a=dash>Dashboard</button><button class=g data-a=out>Sign out</button>`:'';$('#app').innerHTML=V[S.v]();const i=$('#ans');if(i&&!i.disabled)i.focus();window.scrollTo(0,0)}
const cap=()=>{const i=$('#ans'),q=S.t.qs[S.t.i];if(i&&!q.done)q.last=i.value.trim();return q};
const A={
home(){S.v='home';render()},
dash(){if(!S.ok)return;S.v='dash';render();sync(pend()).then(j=>{if(j.status=='ok'){take(j);if(S.v=='dash')render()}}).catch(()=>{})},
out(){S.ok=false;S.pin='';S.t=null;S.v='home';render()},
async go(){if(S.busy)return;const n=$('#nm').value.trim(),p=$('#pn').value.trim(),s=$('#sb').value,pk=/^\d{4,8}$/.test(p),er=m=>{const e=$('#er');if(e)e.textContent=m};if(!n||!pk||!s){er(!n?'Enter your name to continue.':!pk?'Enter your PIN (4 to 8 digits).':'Select a subject to continue.');return}
S.name=n;S.pin=p;S.ok=false;S.subj=s;S.busy=1;er('Signing in…');
try{let j=await sync(pend());if(j.status=='unknown'){if(!confirm(`There is no student called "${n}" yet.\n\nCreate a new student with this PIN?`)){er('');return}j=await sync(pend(),1)}
if(j.status!='ok'){er(j.status=='wrong_pin'?'That PIN does not match this name. Try again.':j.status=='locked'?'Too many wrong PINs. Wait 5 minutes, then try again.':'Could not sign in. Check the name and PIN.');return}
take(j);S.ok=true;D.last=n;save();S.diff=-1;S.topic='';S.v='subj';render()}catch(e){er('Could not reach the server. Check the internet connection and try again.')}finally{S.busy=0}},
diff(v){S.diff=+v;render()},top(v){S.topic=v;render()},
start(){const tp=S.topic,key=[S.name.toLowerCase(),S.subj,tp,S.diff].join('|'),setNo=D.tests.filter(t=>t.key==key).length%10+1;R=rng(`${S.subj}|${tp}|${S.diff}|${setNo}`);const B=BANK[S.subj],names=tp=='Mixed'?shuf(Object.keys(B)):[tp],qs=[],seen=new Set,pool={},prev={};
const gen=nm=>{const all=[].concat(B[nm][S.diff]);if(!pool[nm]||!pool[nm].length){pool[nm]=shuf(all.slice());if(all.length>1&&pool[nm][pool[nm].length-1]==prev[nm])pool[nm].unshift(pool[nm].pop())}return prev[nm]=pool[nm].pop()};
for(let i=0;i<10;i++){const nm=names[i%names.length],g=gen(nm);let q,k=0;do q=g();while(seen.has(q.q)&&++k<30);seen.add(q.q);qs.push({...q,topic:nm,last:'',ok:false,done:false,pts:0})}
const num=Math.max(0,...D.tests.filter(t=>t.student.toLowerCase()==S.name.toLowerCase()&&t.subject==S.subj).map(t=>t.num))+1;
S.t={i:0,qs,num,setNo,key,pup:0,id:`${S.name} - ${S.subj} - ${String(num).padStart(4,'0')}`};S.v='test';render()},
chk(){const q=cap();if(q.done)return;if(!q.last){q.fb='Type an answer first, then press Check Answer.';q.ok=false;render();return}
if(q.fmt&&check(q,q.last)){const fr=/\//.test(q.last);if(q.fmt=='f'&&q.last.replace(/\s/g,'')!==q.d){q.fb=fr?'That has the right value, but it is not in its simplest form. Simplify it and try again.':'That has the right value, but the question asks for a fraction, such as 3/8.';q.ok=false;render();return}if(q.fmt=='d'&&fr){q.fb='That has the right value, but the question asks for a decimal.';q.ok=false;render();return}}
if(check(q,q.last)){q.ok=q.done=true;q.pts=PUP[S.diff];S.t.pup+=q.pts;q.fb=`Correct! 🎉 +${q.pts} ${q.pts>1?'Puppies':'Puppy'} 🐶`;cheer()}else q.fb='Incorrect. Try again, or press Correction to see the answer.';render()},
exp(){const q=cap();q.showEx=!q.showEx;render()},
cor(){const q=cap();q.showCor=true;if(!q.ok){q.done=true;q.fb='Answer revealed. No Puppies awarded for this question.'}render()},
next(){const t=S.t;if(t.i<9){t.i++;render();return}
const rec={uid:window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),id:t.id,num:t.num,key:t.key,student:S.name,subject:S.subj,topic:S.topic,diff:S.diff,setNo:t.setNo,date:new Date().toISOString(),correct:t.qs.filter(q=>q.ok).length,puppies:t.pup,questions:t.qs.map(q=>({topic:q.topic,question:q.q,correctAnswer:q.a,answer:q.last,correct:q.ok,puppies:q.pts}))};
D.tests.push(rec);save();push();t.rec=rec;S.v='done';render()},
again(){S.v='subj';render()}};
/* ---------- Whiteboard: a hidden working-out pad beside each question. Each question keeps its own drawing (q.wb) until the test ends; drawings are never saved or uploaded. ---------- */
const WBS={open:false,ink:'#1b1b1b',era:false},INK=[['#1b1b1b','Black'],['#1557c0','Blue'],['#c62828','Red'],['#1b7f3b','Green']];let wbRO=null;
const wbQ=()=>S.t.qs[S.t.i];
const WB=()=>`<div class="card wb"><div class=wbt><b>✏️ Working out</b>${INK.map(([c,n])=>`<button class="sw ${!WBS.era&&WBS.ink==c?'on':''}" data-a=wbc data-v="${c}" style="background:${c}" aria-label="${n} pen" title="${n} pen"></button>`).join('')}<button id=wbe class="g ${WBS.era?'on':''}" data-a=wbe>Eraser</button><button class=g data-a=wbu>Undo</button><button class=g data-a=wbx>Clear</button></div><canvas id=cv aria-label="Whiteboard for working out"></canvas><small class=mu>Draw with a finger, pen or mouse. Each question keeps its own working until the test ends.</small></div>`;
function wbPaint(cv,st){const x=cv.getContext('2d'),w=cv.width,p=st.p;x.globalCompositeOperation=st.e?'destination-out':'source-over';x.strokeStyle=st.c;x.lineWidth=(st.e?.06:.006)*w;x.lineCap=x.lineJoin='round';x.beginPath();x.moveTo(p[0][0]*w,p[0][1]*w);if(p.length==1)x.lineTo(p[0][0]*w+.01,p[0][1]*w);for(let i=1;i<p.length;i++)x.lineTo(p[i][0]*w,p[i][1]*w);x.stroke()}
function wbDraw(){const cv=$('#cv');if(!cv||!cv.clientWidth||!S.t)return;const d=window.devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);(wbQ().wb||[]).forEach(s=>wbPaint(cv,s))}
function wbUI(){document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!WBS.era&&b.dataset.v==WBS.ink));const e=$('#wbe');if(e)e.classList.toggle('on',WBS.era)}
function wbInit(){const cv=$('#cv');if(!cv)return;const q=wbQ();q.wb=q.wb||[];let cur=null,lw=0;
const pt=e=>{const b=cv.getBoundingClientRect(),w=cv.clientWidth||1;return[(e.clientX-b.left-cv.clientLeft)/w,(e.clientY-b.top-cv.clientTop)/w]};
cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}cur={c:WBS.ink,e:WBS.era,p:[pt(e)]};q.wb.push(cur);wbPaint(cv,cur)};
cv.onpointermove=e=>{if(!cur)return;const p=pt(e),l=cur.p[cur.p.length-1];cur.p.push(p);wbPaint(cv,{c:cur.c,e:cur.e,p:[l,p]})};
cv.onpointerup=cv.onpointercancel=()=>{cur=null};
wbDraw();lw=cv.clientWidth;
if(window.ResizeObserver){wbRO=new ResizeObserver(()=>{if(cv.clientWidth!=lw){lw=cv.clientWidth;wbDraw()}});wbRO.observe(cv)}}
function wbMount(){document.body.classList.toggle('wide',S.v=='test'&&WBS.open);if(wbRO){wbRO.disconnect();wbRO=null}if(S.v!='test')return;const card=$('#app .card'),h=card&&card.querySelector('h2');if(!h)return;
const tw=document.createElement('div'),qh=document.createElement('div');tw.className='tw'+(WBS.open?' open':'');card.before(tw);tw.append(card);
qh.className='qh';h.before(qh);qh.append(h);qh.insertAdjacentHTML('beforeend',`<button class=g data-a=wb aria-expanded=${WBS.open}>✏️ ${WBS.open?'Hide':'Show'} whiteboard</button>`);
if(WBS.open){tw.insertAdjacentHTML('beforeend',WB());wbInit()}const i=$('#ans');if(i&&!i.disabled)i.focus()}
const render0=render;render=function(){render0();wbMount()};
Object.assign(A,{wb(){cap();WBS.open=!WBS.open;render()},wbc(v){WBS.ink=v;WBS.era=false;wbUI()},wbe(){WBS.era=!WBS.era;wbUI()},wbu(){(wbQ().wb||[]).pop();wbDraw()},wbx(){(wbQ().wb||[]).length=0;wbDraw()}});
document.body.onclick=e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a.dataset.v)};
document.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ans')A.chk();if(e.key==='Enter'&&(e.target.id==='nm'||e.target.id==='pn'))A.go()};
render();
</script></body></html>
